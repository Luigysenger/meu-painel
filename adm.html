<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Anti-Cache para atualizar em dispositivos móveis e desktops -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL ADM - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- TRAVA CIRÚRGICA DE TELA (IMPEDE MOVIMENTO LATERAL) --- */
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :root { --primary: #A020F0; --pink-light: #FFB6C1; --bg: #000; --card: #121212; --text-muted: #b3b3b3; --success: #1DB954; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 20px 30px; border-radius: 15px; border: 1px solid #333; margin-bottom: 25px; gap: 10px; flex-wrap: wrap; transition: 0.3s; width: 100%; max-width: 1200px; }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex-shrink: 0; }
        .header h2 { margin: 0; color: var(--primary); font-size: 22px; text-transform: uppercase; line-height: 1; }

        .btn-header { background: none; border: 1px solid #333; color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-weight: bold; }
        .btn-header:hover { background: #222; border-color: var(--primary); }
        .btn-sair { color: #ff4444; border-color: #442222; padding: 4px 10px; }
        .btn-sair:hover { background: #331111; border-color: #ff4444; }

        .main-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; align-items: start; margin-bottom: 120px; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #282828; width: 100%; }
        h3 { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-align: center; }

        /* GRADE E CARDS COLORIDOS DE RÁDIO COM TRAVA LATERAL */
        .radio-grid-adm { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%;
            touch-action: pan-y !important;
            overflow-x: hidden !important;
        }

        .radio-card-adm { 
            width: 100% !important;
            min-height: 75px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            color: #000; 
            font-weight: bold; 
            padding: 12px 16px; 
            cursor: grab; 
            transition: transform 0.2s, box-shadow 0.2s; 
            position: relative; 
            border: 2px solid transparent; 
            box-sizing: border-box; 
            touch-action: pan-y !important;
            margin: 0 !important;
            transform: none !important;
        }

        .radio-card-adm:active { cursor: grabbing; }
        .radio-card-adm.playing { border-color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }

        .card-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .card-title { font-size: 15px; text-transform: uppercase; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 10px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.15); }
        
        .btn-card-action {
            background: rgba(0,0,0,0.2);
            border: none;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-card-action:hover { background: rgba(0,0,0,0.4); color: #fff; }

        .input-adm { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 10px; margin-bottom: 10px; outline: none; }
        .btn-adm { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        
        .msg-box-item {
            background: #181818;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
        }

        /* MODAL DE EDIÇÃO */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #121212; border: 1px solid var(--primary); border-radius: 15px; padding: 20px; width: 100%; max-width: 400px; }

        /* PLAYER FIXO ADM */
        .player-footer-adm { position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 15px; border-top: 2px solid var(--primary); text-align: center; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h2>PAINEL DO ADMINISTRADOR</h2>
            <button class="btn-header btn-sair" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>SAIR</span></button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- GERENCIAR E OUVIR RÁDIOS (EM CARDS) -->
        <div class="card">
            <h3>CADASTRAR NOVA RÁDIO</h3>
            <input type="text" id="nome-radio" class="input-adm" placeholder="Nome da Rádio">
            <input type="text" id="url-radio" class="input-adm" placeholder="URL do Stream">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <label style="font-size: 11px; color: #aaa;">COR DO CARD:</label>
                <input type="color" id="cor-radio" class="input-adm" value="#d1a3ff" style="height: 40px; padding: 2px; cursor: pointer;">
            </div>
            <button class="btn-adm" onclick="salvarRadio()">CADASTRAR RÁDIO</button>

            <h3 style="margin-top: 30px;">GRADE DE RÁDIOS (ARRASTE PARA REORDENAR)</h3>
            <div id="lista-radios-adm" class="radio-grid-adm"></div>
        </div>

        <!-- MENSAGENS DOS OUVINTES E RESPOSTAS -->
        <div class="card">
            <h3>MENSAGENS / PEDIDOS DOS OUVINTES</h3>
            <div id="lista-mensagens-ouvintes"></div>
        </div>

    </div>

    <!-- MODAL DE EDIÇÃO DE RÁDIO -->
    <div id="modal-edit" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">EDITAR RÁDIO</h3>
            <input type="hidden" id="edit-key">
            <label style="font-size:10px; color:#aaa;">NOME DA RÁDIO</label>
            <input type="text" id="edit-nome" class="input-adm">
            <label style="font-size:10px; color:#aaa;">URL DO STREAM</label>
            <input type="text" id="edit-url" class="input-adm">
            <label style="font-size:10px; color:#aaa;">COR DO CARD</label>
            <input type="color" id="edit-cor" class="input-adm" style="height: 40px; padding: 2px; cursor: pointer;">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-adm" onclick="confirmarEdicao()">SALVAR</button>
                <button class="btn-adm" style="background:#444;" onclick="fecharModal()">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- PLAYER FOOTER PARA O ADM OUVIR AS RÁDIOS -->
    <div class="player-footer-adm">
        <div id="player-title" style="font-size: 12px; font-weight: bold; color: #fff;">Nenhuma rádio tocando no momento</div>
        <button id="btn-play-adm" class="btn-card-action" style="background: var(--primary); color: #fff; width: 40px; height: 40px;" onclick="togglePlay()"><i class="fas fa-play"></i></button>
    </div>

    <audio id="audio-adm"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-adm');

        localStorage.setItem('userId', 'admin');

        let radiosArray = [];
        let radioTocandoKey = null;

        // CARREGAR E RENDERIZAR RÁDIOS EM CARDS COLORIDOS
        db.ref('radios').on('value', snap => {
            radiosArray = [];
            snap.forEach(child => {
                radiosArray.push({ key: child.key, ...child.val() });
            });

            // ORDENAR COM BASE NA POSIÇÃO SALVA
            radiosArray.sort((a, b) => (a.posicao || 0) - (b.posicao || 0));

            const container = document.getElementById('lista-radios-adm');
            container.innerHTML = "";

            radiosArray.forEach((r, idx) => {
                const isPlaying = radioTocandoKey === r.key;
                const cardColor = r.color || '#d1a3ff';

                container.innerHTML += `
                    <div class="radio-card-adm ${isPlaying ? 'playing' : ''}" style="background: ${cardColor};" data-id="${r.key}" onclick="ouvirRadio('${r.key}')">
                        <div class="card-top">
                            <span class="card-title">
                                <i class="fas fa-bars" style="opacity:0.5; cursor:grab;"></i>
                                <i class="fas ${isPlaying ? 'fa-volume-high' : 'fa-radio'}"></i>
                                ${r.name}
                            </span>
                        </div>
                        <div class="card-bottom" onclick="event.stopPropagation()">
                            <button class="btn-card-action" title="Editar Rádio" onclick="abrirEdicao('${r.key}')">
                                <i class="fas fa-pencil-alt"></i>
                            </button>
                            <button class="btn-card-action" title="Excluir Rádio" onclick="excluirRadio('${r.key}')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        });

        // TOCAR/PAUSAR RÁDIO NO PAINEL ADM
        function ouvirRadio(key) {
            const radio = radiosArray.find(r => r.key === key);
            if(!radio) return;

            if(radioTocandoKey === key) {
                togglePlay();
            } else {
                radioTocandoKey = key;
                player.src = radio.url;
                player.play();
                document.getElementById('player-title').innerText = "TOCANDO ADM: " + radio.name;
                document.getElementById('btn-play-adm').innerHTML = '<i class="fas fa-pause"></i>';
                db.ref('radios').off('value'); // Atualização de estado leve
            }
        }

        function togglePlay() {
            if(!player.src) return;
            if(player.paused) {
                player.play();
                document.getElementById('btn-play-adm').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                player.pause();
                document.getElementById('btn-play-adm').innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // SALVAR NOVA RÁDIO
        function salvarRadio() {
            const nome = document.getElementById('nome-radio').value.trim();
            const url = document.getElementById('url-radio').value.trim();
            const cor = document.getElementById('cor-radio').value;

            if(!nome || !url) return alert("Preencha o nome e a URL da rádio!");

            const novaPosicao = radiosArray.length;

            db.ref('radios').push({ 
                name: nome, 
                url: url, 
                color: cor,
                posicao: novaPosicao 
            }).then(() => {
                document.getElementById('nome-radio').value = "";
                document.getElementById('url-radio').value = "";
            });
        }

        // EDITAR RÁDIO
        function abrirEdicao(key) {
            const r = radiosArray.find(item => item.key === key);
            if(!r) return;

            document.getElementById('edit-key').value = key;
            document.getElementById('edit-nome').value = r.name;
            document.getElementById('edit-url').value = r.url;
            document.getElementById('edit-cor').value = r.color || '#d1a3ff';
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-edit').style.display = 'none';
        }

        function confirmarEdicao() {
            const key = document.getElementById('edit-key').value;
            const nome = document.getElementById('edit-nome').value.trim();
            const url = document.getElementById('edit-url').value.trim();
            const cor = document.getElementById('edit-cor').value;

            if(!nome || !url) return alert("Preencha todos os campos!");

            db.ref('radios/' + key).update({
                name: nome,
                url: url,
                color: cor
            }).then(() => {
                fecharModal();
            });
        }

        // EXCLUIR RÁDIO
        function excluirRadio(key) {
            if(confirm("Tem certeza que deseja excluir esta rádio?")) {
                db.ref('radios/' + key).remove();
            }
        }

        // ARRASTAR E ORDENAR OS CARDS (EXCLUSIVO NO EIXO VERTICAL - Y)
        new Sortable(document.getElementById('lista-radios-adm'), {
            animation: 150,
            direction: 'vertical',
            delay: 100,
            delayOnTouchOnly: true,
            forceFallback: true,
            fallbackOnBody: true,
            onEnd: function() {
                document.querySelectorAll('#lista-radios-adm .radio-card-adm').forEach((el, index) => {
                    const key = el.getAttribute('data-id');
                    db.ref('radios/' + key).update({ posicao: index });
                });
            }
        });

        // CARREGAR E RESPONDER MENSAGENS DOS OUVINTES
        db.ref('mensagens_ouvintes').on('value', snap => {
            const container = document.getElementById('lista-mensagens-ouvintes');
            container.innerHTML = "";
            const data = snap.val() || {};

            let temMensagem = false;

            for(let id in data) {
                temMensagem = true;
                const m = data[id];
                container.innerHTML += `
                    <div class="msg-box-item">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong style="color: var(--pink-light);">${m.ouvinte || m.nome}</strong>
                            <span style="font-size:10px; color:#666;">${m.dataHora || ''}</span>
                        </div>
                        <div style="font-size:13px; margin-bottom:10px; word-break:break-word;">${m.mensagem}</div>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="resp-${id}" class="input-adm" placeholder="Responder este ouvinte..." style="margin: 0; font-size: 11px;">
                            <button class="btn-adm" style="width: auto; padding: 0 12px; font-size: 11px;" onclick="responderOuvinte('${id}', '${m.ouvinte || m.nome}', '${m.ouvinteId || ''}')">Enviar</button>
                        </div>
                    </div>
                `;
            }

            if(!temMensagem) {
                container.innerHTML = "<p style='color:#777; text-align:center; font-size:12px;'>Nenhuma mensagem enviada pelos ouvintes até o momento.</p>";
            }
        });

        function responderOuvinte(msgId, ouvinteNome, ouvinteId) {
            const input = document.getElementById(`resp-${msgId}`);
            const resposta = input.value.trim();

            if(!resposta) return alert("Digite uma resposta antes de enviar!");

            db.ref('respostas_adm').push({
                ouvinte: ouvinteNome,
                ouvinteId: ouvinteId,
                resposta: resposta,
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert("Resposta enviada para o ouvinte com sucesso!");
                input.value = "";
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
