<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL ADM - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- TRAVA CIRÚRGICA DE TELA & APLICATIVO --- */
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :root { --primary: #A020F0; --pink-light: #FFB6C1; --bg: #000; --card: #121212; --text-muted: #b3b3b3; --success: #1DB954; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 20px 30px; border-radius: 15px; border: 1px solid #333; margin-bottom: 25px; gap: 10px; flex-wrap: wrap; transition: 0.3s; width: 100%; max-width: 1200px; }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex-shrink: 0; }
        .header h2 { margin: 0; color: var(--primary); font-size: 22px; text-transform: uppercase; line-height: 1; }

        .btn-header { background: none; border: 1px solid #333; color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-weight: bold; }
        .btn-header:hover { background: #222; border-color: var(--primary); }
        .btn-sair { color: #ff4444; border-color: #442222; padding: 4px 10px; }
        .btn-sair:hover { background: #331111; border-color: #ff4444; }

        .main-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; align-items: start; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #282828; width: 100%; }
        h3 { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-align: center; }

        /* TRAVA DE ARRASTE VERTICAL */
        .radio-grid-adm { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%;
            touch-action: pan-y !important;
            overflow-x: hidden !important;
        }

        .radio-item-adm { 
            width: 100% !important;
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            padding: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            touch-action: pan-y !important; 
            margin: 0 !important;
            transform: none !important;
        }

        .input-adm { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 10px; margin-bottom: 10px; outline: none; }
        .btn-adm { background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        
        .msg-box-item {
            background: #181818;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h2>PAINEL DO ADMINISTRADOR</h2>
            <button class="btn-header btn-sair" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>SAIR</span></button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- GERENCIAR RÁDIOS -->
        <div class="card">
            <h3>CADASTRAR RÁDIO</h3>
            <input type="text" id="nome-radio" class="input-adm" placeholder="Nome da Rádio">
            <input type="text" id="url-radio" class="input-adm" placeholder="URL do Stream">
            <input type="color" id="cor-radio" class="input-adm" value="#A020F0" style="height: 40px;">
            <button class="btn-adm" onclick="salvarRadio()">Salvar Rádio</button>

            <h3 style="margin-top: 25px;">ORDENAR RÁDIOS (ARRASTE VERTICAL)</h3>
            <div id="lista-radios-adm" class="radio-grid-adm"></div>
        </div>

        <!-- MENSAGENS DOS OUVINTES E RESPOSTAS -->
        <div class="card">
            <h3>MENSAGENS / PEDIDOS DOS OUVINTES</h3>
            <div id="lista-mensagens-ouvintes"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DEFINIR SESSÃO COMO ADMIN
        localStorage.setItem('userId', 'admin');

        // CARREGAR LISTA DE RÁDIOS
        db.ref('radios').on('value', snap => {
            const container = document.getElementById('lista-radios-adm');
            container.innerHTML = "";
            snap.forEach(child => {
                const r = child.val();
                const key = child.key;
                container.innerHTML += `
                    <div class="radio-item-adm" data-id="${key}">
                        <span><i class="fas fa-bars" style="margin-right: 8px; color: #666;"></i> ${r.name}</span>
                        <i class="fas fa-trash" style="color: #ff4444; cursor: pointer;" onclick="excluirRadio('${key}')"></i>
                    </div>
                `;
            });
        });

        function salvarRadio() {
            const nome = document.getElementById('nome-radio').value.trim();
            const url = document.getElementById('url-radio').value.trim();
            const cor = document.getElementById('cor-radio').value;

            if(!nome || !url) return alert("Preencha nome e URL!");

            db.ref('radios').push({ name: nome, url: url, color: cor }).then(() => {
                document.getElementById('nome-radio').value = "";
                document.getElementById('url-radio').value = "";
            });
        }

        function excluirRadio(key) {
            if(confirm("Excluir esta rádio?")) db.ref('radios/' + key).remove();
        }

        // CONFIGURAÇÃO DO ARRASTE SOMENTE VERTICAL
        new Sortable(document.getElementById('lista-radios-adm'), {
            animation: 150,
            direction: 'vertical',
            delay: 100,
            delayOnTouchOnly: true,
            forceFallback: true,
            fallbackOnBody: true,
            onEnd: function() {
                let index = 0;
                document.querySelectorAll('#lista-radios-adm .radio-item-adm').forEach(el => {
                    const key = el.getAttribute('data-id');
                    db.ref('radios/' + key).update({ posicao: index++ });
                });
            }
        });

        // CARREGAR E RESPONDER MENSAGENS DOS OUVINTES
        db.ref('mensagens_ouvintes').on('value', snap => {
            const container = document.getElementById('lista-mensagens-ouvintes');
            container.innerHTML = "";
            const data = snap.val() || {};

            let temMensagem = false;

            for(let id in data) {
                temMensagem = true;
                const m = data[id];
                container.innerHTML += `
                    <div class="msg-box-item">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong style="color: var(--pink-light);">${m.ouvinte || m.nome}</strong>
                            <span style="font-size:10px; color:#666;">${m.dataHora || ''}</span>
                        </div>
                        <div style="font-size:13px; margin-bottom:10px; word-break:break-word;">${m.mensagem}</div>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="resp-${id}" class="input-adm" placeholder="Responder este ouvinte..." style="margin: 0; font-size: 11px;">
                            <button class="btn-adm" style="width: auto; padding: 0 12px; font-size: 11px;" onclick="responderOuvinte('${id}', '${m.ouvinte || m.nome}', '${m.ouvinteId || ''}')">Enviar</button>
                        </div>
                    </div>
                `;
            }

            if(!temMensagem) {
                container.innerHTML = "<p style='color:#777; text-align:center; font-size:12px;'>Nenhuma mensagem enviada pelos ouvintes até o momento.</p>";
            }
        });

        function responderOuvinte(msgId, ouvinteNome, ouvinteId) {
            const input = document.getElementById(`resp-${msgId}`);
            const resposta = input.value.trim();

            if(!resposta) return alert("Digite uma resposta antes de enviar!");

            db.ref('respostas_adm').push({
                ouvinte: ouvinteNome,
                ouvinteId: ouvinteId,
                resposta: resposta,
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert("Resposta enviada para o ouvinte com sucesso!");
                input.value = "";
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
