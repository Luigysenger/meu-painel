<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL ADM SUPREMO - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1DB954; --bg: #000; --card: #121212; --text-muted: #b3b3b3; --purple-light: #a855f7; --blue-online: #38bdf8; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; user-select: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 15px 20px; border-radius: 15px; border: 1px solid #282828; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        .header-brand { display: flex; flex-direction: column; gap: 2px; }
        .header-title { font-size: 20px; font-weight: 900; color: #a855f7; letter-spacing: 1px; margin: 0; text-transform: uppercase; }
        .header-sub { font-size: 13px; color: #e5e7eb; font-weight: 600; margin: 0; }
        
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .info-pill { background: #1e1e1e; border: 1px solid #333; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .info-pill i { color: #a855f7; }
        
        .btn-msg-notif { background: #ff4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .btn-msg-notif span { background: white; color: #ff4444; padding: 2px 6px; border-radius: 50%; font-size: 12px; }
        .btn-header { background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-header:hover { background: #2a2a2a; }
        .btn-sair { color: #ff4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-sair:hover { background: rgba(239, 68, 68, 0.2); }

        @media (max-width: 850px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-brand { align-items: center; }
            .header-right { justify-content: center; }
        }

        #container-mensagens-adm { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-in-out; }
        #container-mensagens-adm.aberto { max-height: 2000px; margin-bottom: 25px; }
        .msg-grid-adm { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 10px; background: #080808; border-radius: 15px; border: 1px solid #222; }
        .msg-card-individual { background: #181818; border: 1px solid #333; border-radius: 12px; padding: 15px; position: relative; }
        .msg-card-individual h4 { margin: 0 0 5px 0; color: var(--primary); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .msg-card-individual p { font-size: 13px; margin: 10px 0; line-height: 1.4; color: #eee; background: #222; padding: 8px; border-radius: 5px; }
        .msg-card-individual textarea { width: 100%; background: #111; border: 1px solid #444; border-radius: 6px; color: #fff; padding: 8px; font-size: 12px; margin-top: 8px; resize: none; box-sizing: border-box; }
        .msg-card-individual .btn-resp-adm { background: var(--primary); color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; cursor: pointer; margin-top: 6px; width: 100%; text-transform: uppercase; }

        .main-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        @media (max-width: 1024px) { .main-grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #282828; margin-bottom: 20px; }
        h3 { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }

        .radio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        @media (max-width: 480px) { .radio-grid { grid-template-columns: repeat(2, 1fr); } }

        .radio-item { aspect-ratio: 1/1; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 12px; text-align: center; padding: 10px; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; position: relative; border: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
        .radio-item:active { cursor: grabbing; }
        .radio-item.sortable-ghost { opacity: 0.4; border: 2px dashed #1DB954; }
        .radio-item.active { background: #000 !important; color: var(--primary) !important; border-color: var(--primary); box-shadow: 0 0 15px rgba(29, 185, 84, 0.3); }
        .radio-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 10; }
        .radio-actions i { cursor: pointer; padding: 4px; background: rgba(0,0,0,0.1); border-radius: 4px; font-size: 11px; }

        .antena { font-size: 24px; margin-bottom: 8px; display: none; color: var(--primary); }
        .active .antena { display: block !important; animation: antenaPisca 0.8s infinite alternate !important; }
        @keyframes antenaPisca { from { opacity: 1; transform: scale(1.1); } to { opacity: 0.1; transform: scale(0.9); } }

        .speaker-icon { color: #38bdf8; margin-right: 8px; animation: speakerPisca 0.8s infinite alternate; }
        @keyframes speakerPisca { from { opacity: 1; transform: scale(1.2); } to { opacity: 0.2; transform: scale(0.9); } }

        .player-footer { margin-top: 20px; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .controls-row { display: flex; align-items: center; justify-content: center; gap: 25px; }
        .btn-nav { background: none; border: none; color: #b3b3b3; font-size: 24px; cursor: pointer; }
        .btn-spotify-play { width: 55px; height: 55px; background: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: black; cursor: pointer; }

        .pub-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 600px) { .pub-container { grid-template-columns: 1fr; } }
        .pub-preview { width: 100%; max-height: 120px; object-fit: contain; margin-top: 10px; border-radius: 10px; border: 1px dashed #444; display: none; }

        /* MONITOR DE OUVINTES DO PAINEL ADM */
        .user-item { background: #141414; margin-bottom: 12px; border-radius: 12px; border: 1px solid #222; overflow: hidden; transition: 0.3s; }
        .user-item.online { border-left: 5px solid var(--blue-online); background: #181818; }
        .user-item.offline { border-left: 5px solid var(--purple-light); opacity: 0.8; }
        
        .user-header-bar { width: 100%; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .user-title { color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; }
        .status-on { color: var(--blue-online); font-weight: 900; font-size: 11px; background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 6px; }
        .status-off { color: var(--purple-light); font-weight: 900; font-size: 11px; background: rgba(168, 85, 247, 0.1); padding: 4px 8px; border-radius: 6px; }
        
        .user-details-bar { padding: 10px 15px 15px 15px; font-size: 12px; color: #ccc; border-top: 1px solid #222; background: #111; line-height: 1.8; }

        input, select { padding: 12px; background: #2a2a2a; border: none; color: white; border-radius: 8px; margin-bottom: 10px; width: -webkit-fill-available; outline: none; font-size: 14px; }
        .btn-save { padding: 12px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <h2 class="header-title">PAINEL ADM</h2>
            <p class="header-sub">Seja bem vindo ADM</p>
        </div>

        <div class="header-right">
            <button class="btn-msg-notif" onclick="toggleMensagens()">
                <i class="fas fa-envelope"></i> MENSAGENS <span id="count-msg">0</span>
            </button>
            
            <button class="btn-header" onclick="location.reload()" title="Reiniciar">
                <i class="fas fa-sync-alt"></i> REINICIAR
            </button>

            <div class="info-pill">
                <i class="far fa-clock"></i>
                <span id="hora">00:00:00</span>
            </div>

            <div class="info-pill" id="weather-pill">
                <i class="fas fa-sun" id="weather-icon" style="color: #f59e0b;"></i>
                <span id="weather-text">Carregando...</span>
            </div>

            <button class="btn-header btn-sair" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> SAIR
            </button>
        </div>
    </div>

    <div id="container-mensagens-adm">
        <div class="card">
            <div style="display:flex; justify- continental space-between; align-items: center; margin-bottom: 15px;">
                <h3>MENSAGENS DOS OUVINTES</h3>
                <button onclick="window.print()" class="btn-header" style="font-size: 11px;"><i class="fas fa-file-pdf"></i> PDF</button>
            </div>
            <div id="msg-list-adm" class="msg-grid-adm"></div>
        </div>
    </div>

    <div class="main-grid">
        <div class="col-left">
            <div class="card">
                <h3>GERENCIAR EMISSORA</h3>
                <div class="input-group">
                    <input type="hidden" id="r-key">
                    <input type="text" id="r-name" placeholder="Nome da Rádio">
                    <input type="text" id="r-url" placeholder="Link .mp3">
                    <button class="btn-save" id="btn-radio-action" onclick="addRadio()">SALVAR</button>
                </div>
                <h3>GRADE DE RÁDIOS (ARRASTE PARA ORGANIZAR)</h3>
                <div id="radio-list" class="radio-grid"></div>
                <div class="player-footer">
                    <div id="now-title" style="font-size:10px; color:#888; margin-bottom:15px;">SELECIONE UMA RÁDIO</div>
                    <div class="controls-row">
                        <button class="btn-nav" onclick="prevRadio()"><i class="fas fa-step-backward"></i></button>
                        <button class="btn-spotify-play" onclick="togglePlay()"><i class="fas fa-play" id="play-icon"></i></button>
                        <button class="btn-nav" onclick="nextRadio()"><i class="fas fa-step-forward"></i></button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>GERENCIAR PUBLICIDADE</h3>
                <div class="pub-container">
                    <input type="hidden" id="pub-key">
                    <div>
                        <input type="file" id="pub-file" accept="image/*" onchange="previewPub(this)">
                        <img id="pub-view" class="pub-preview">
                    </div>
                    <div>
                        <input type="datetime-local" id="pub-ini">
                        <input type="datetime-local" id="pub-fim">
                        <select id="pub-target" onchange="document.getElementById('pub-manual').style.display = (this.value=='MANUAL'?'block':'none')">
                            <option value="TODOS">TODOS OS OUVINTES</option>
                            <option value="MANUAL">SELECIONAR MANUAL</option>
                        </select>
                        <input type="text" id="pub-manual" placeholder="NOME DO OUVINTE" style="display:none;">
                    </div>
                </div>
                <button class="btn-save" id="btn-pub-action" onclick="savePub()">LANÇAR CAMPANHA</button>
                <div id="pub-list-admin" style="margin-top:20px;"></div>
            </div>
        </div>

        <div class="col-right">
            <div class="card">
                <h3><i class="fas fa-users"></i> MONITOR DE OUVINTES</h3>
                <div id="user-list"></div>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-player');
        let radioData = [], activeIndex = -1, imgBase64 = "", sortableInstance = null;
        let rawContas = {}, rawPreferencias = {}, rawOnlineState = {};

        // Atualizador de relógio e cronômetros
        setInterval(() => {
            const hElement = document.getElementById('hora');
            if(hElement) hElement.innerText = new Date().toLocaleTimeString('pt-BR');
            updateLiveTimers();
        }, 1000);

        async function fetchWeather() {
            try {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}`);
                        const geoData = await geoRes.json();
                        const city = geoData.results?.[0]?.name || "Local";
                        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const wData = await wRes.json();
                        updateWeatherUI(city, Math.round(wData.current_weather.temperature), wData.current_weather.weathercode);
                    }, () => fetchFallbackWeather());
                } else { fetchFallbackWeather(); }
            } catch (e) { fetchFallbackWeather(); }
        }

        async function fetchFallbackWeather() {
            try {
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-24.9578&longitude=-53.4594&current_weather=true`);
                const wData = await wRes.json();
                updateWeatherUI("Cascavel", Math.round(wData.current_weather.temperature), wData.current_weather.weathercode);
            } catch (e) { document.getElementById('weather-text').innerText = "Indisponível"; }
        }

        function updateWeatherUI(city, temp, code) {
            const txt = document.getElementById('weather-text'), icon = document.getElementById('weather-icon');
            if(!txt || !icon) return;
            txt.innerText = `${city}: ${temp}°C`;
            icon.className = code === 0 ? "fas fa-sun" : (code <= 3 ? "fas fa-cloud-sun" : "fas fa-cloud");
            icon.style.color = code === 0 ? "#f59e0b" : "#cbd5e1";
        }
        fetchWeather();

        function logout() { if(confirm("Sair?")) { localStorage.removeItem('usuarioNome'); window.location.href = 'index.html'; } }
        function toggleMensagens() { document.getElementById('container-mensagens-adm').classList.toggle('aberto'); }

        db.ref('mensagens_ouvintes').on('value', snapMsgs => {
            const container = document.getElementById('msg-list-adm'), countElem = document.getElementById('count-msg');
            if(!container) return;
            container.innerHTML = "";
            const msgs = snapMsgs.val() || {};
            let total = 0;
            for(let key in msgs) {
                total++;
                const m = msgs[key], nomeExibicao = m.ouvinte || m.nome || 'Ouvinte';
                const card = document.createElement('div'); card.className = "msg-card-individual";
                card.innerHTML = `<h4><span><i class="fas fa-user"></i> ${nomeExibicao}</span><i class="fas fa-trash-alt" style="color:#ff4444; cursor:pointer;" onclick="db.ref('mensagens_ouvintes/${key}').remove()"></i></h4>
                    <span style="font-size: 10px; color: #888;">${m.dataHora || ''}</span><p>${m.mensagem}</p>
                    <textarea id="resp-input-${key}" rows="2" placeholder="Escreva sua resposta..."></textarea>
                    <button class="btn-resp-adm" onclick="responderOuvinte('${key}', '${m.ouvinteId || ''}', '${nomeExibicao}')">Responder</button>`;
                container.appendChild(card);
            }
            if(countElem) countElem.innerText = total;
        });

        function responderOuvinte(msgKey, ouvinteId, ouvinteNome) {
            const txtInput = document.getElementById(`resp-input-${msgKey}`);
            if(!txtInput || !txtInput.value.trim()) return alert("Digite uma resposta!");
            db.ref('respostas_adm').push({ msgKey, ouvinteId, ouvinte: ouvinteNome, resposta: txtInput.value.trim(), dataHora: new Date().toLocaleString('pt-BR'), timestamp: firebase.database.ServerValue.TIMESTAMP }).then(() => {
                alert("Resposta enviada!"); txtInput.value = "";
            });
        }

        // CARREGA E HABILITA RÁDIOS
        db.ref('radios').on('value', snap => {
            radioData = []; snap.forEach(c => { radioData.push({ ...c.val(), key: c.key }); });
            radioData.sort((a,b) => (a.posicao || 0) - (b.posicao || 0));
            renderRadioGrid();
        });

        function renderRadioGrid() {
            const list = document.getElementById('radio-list'); if(!list) return;
            list.innerHTML = "";
            radioData.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = `radio-item ${activeIndex === i ? 'active' : ''}`;
                div.style.background = r.color || '#ece4db';
                div.dataset.key = r.key;
                div.onclick = () => playRadio(i);
                div.innerHTML = `<div class="radio-actions"><i class="fas fa-pencil-alt" onclick="event.stopPropagation(); prepareEditRadio('${r.key}','${r.name}','${r.url}')"></i><i class="fas fa-times" onclick="event.stopPropagation(); if(confirm('Excluir?')) db.ref('radios/${r.key}').remove()"></i></div><i class="fas fa-tower-broadcast antena"></i><span>${r.name}</span>`;
                list.appendChild(div);
            });

            if(!sortableInstance) {
                sortableInstance = new Sortable(list, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function () {
                        const items = list.querySelectorAll('.radio-item');
                        items.forEach((item, index) => {
                            const key = item.dataset.key;
                            if(key) db.ref('radios/' + key).update({ posicao: index });
                        });
                    }
                });
            }
        }

        function playRadio(idx) {
            activeIndex = idx; const r = radioData[idx]; player.src = r.url; player.play();
            document.getElementById('now-title').innerText = "OUVINDO: " + r.name;
            document.getElementById('play-icon').className = "fas fa-stop";
            renderRadioGrid();
        }
        function togglePlay() { if(player.paused) { player.play(); document.getElementById('play-icon').className = "fas fa-stop"; } else { player.pause(); document.getElementById('play-icon').className = "fas fa-play"; } }
        function nextRadio() { if(radioData.length) playRadio((activeIndex + 1) % radioData.length); }
        function prevRadio() { if(radioData.length) playRadio((activeIndex - 1 + radioData.length) % radioData.length); }
        function addRadio() {
            const n = document.getElementById('r-name').value, u = document.getElementById('r-url').value, k = document.getElementById('r-key').value;
            if(n && u) {
                if(k) db.ref('radios/'+k).update({name:n, url:u});
                else db.ref('radios').push({ name: n, url: u, color: '#ece4db', posicao: radioData.length });
                document.getElementById('r-name').value = ""; document.getElementById('r-url').value = ""; document.getElementById('r-key').value = "";
            }
        }
        function prepareEditRadio(k, n, u) { document.getElementById('r-key').value = k; document.getElementById('r-name').value = n; document.getElementById('r-url').value = u; }

        function previewPub(input) {
            const reader = new FileReader();
            reader.onload=(e)=>{imgBase64=e.target.result;document.getElementById('pub-view').src=imgBase64;document.getElementById('pub-view').style.display="block"};
            if(input.files[0])reader.readAsDataURL(input.files[0]);
        }
        function savePub() {
            const i=document.getElementById('pub-ini').value, f=document.getElementById('pub-fim').value, k=document.getElementById('pub-key').value;
            if(!imgBase64 || !i) return;
            const d = { imagem: imgBase64, inicio: new Date(i).getTime(), fim: new Date(f).getTime(), destino: document.getElementById('pub-target').value, ouvinteAlvo: document.getElementById('pub-manual').value || 'TODOS' };
            if(k) db.ref('publicidade/'+k).update(d); else db.ref('publicidade').push(d);
            document.getElementById('pub-key').value = ""; document.getElementById('pub-view').style.display="none"; alert("OK");
        }

        // ==========================================
        // MONITOR DE OUVINTES MULTI-NÓS (REALTIME)
        // ==========================================
        function renderOuvintes() {
            const container = document.getElementById('user-list'); 
            if(!container) return;
            
            const agora = Date.now();
            container.innerHTML = "";

            // Junta todas as chaves de ouvintes registradas
            const allKeys = new Set([...Object.keys(rawContas), ...Object.keys(rawPreferencias), ...Object.keys(rawOnlineState)]);

            allKeys.forEach(k => {
                const conta = rawContas[k] || {};
                const pref = rawPreferencias[k] || {};
                const onState = rawOnlineState[k] || {};

                const nome = conta.nome || conta.usuario || pref.nome || k;
                const safeKey = k.replace(/[^a-zA-Z0-9]/g, '_');

                // Verificação de Atividade Instantânea (limite max de 12 segundos sem ping)
                const lastActive = pref.lastActive || onState.lastActive || pref.timestamp || 0;
                const statusExplicit = pref.status || onState.status || (pref.online === true ? 'online' : '');
                
                const isOnline = (statusExplicit === 'online' || (agora - lastActive < 12000));

                const radioTocando = isOnline ? (pref.radioAtual || onState.radioAtual || 'Nenhuma') : 'Nenhuma';
                const sessionStart = pref.sessionStart || onState.sessionStart || (isOnline ? (lastActive || agora) : agora);
                const radioStart = pref.radioStart || onState.radioStart || (isOnline ? (lastActive || agora) : agora);

                const div = document.createElement('div');
                div.className = `user-item ${isOnline ? 'online' : 'offline'}`;
                
                const iconSpeaker = isOnline ? `<i class="fas fa-volume-high speaker-icon"></i>` : '';

                div.innerHTML = `
                    <div class="user-header-bar">
                        <span class="user-title">
                            ${iconSpeaker} ${nome}
                        </span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="${isOnline ? 'status-on' : 'status-off'}">${isOnline ? '● ONLINE' : 'OFF'}</span>
                            <i class="fas fa-trash-alt" style="color: #ff4444; cursor: pointer; font-size: 13px;" 
                               title="Excluir Ouvinte" onclick="deletarOuvinte('${k}')"></i>
                        </div>
                    </div>
                    <div class="user-details-bar">
                        <div>Rádio Atual: <b style="color:var(--primary)">${radioTocando}</b></div>
                        <div>Tempo de Sessão: <b style="color:#38bdf8" id="ts-${safeKey}" data-start="${sessionStart}" data-online="${isOnline}">00:00:00</b></div>
                        <div>Tempo nesta Rádio: <b style="color:#a855f7" id="tr-${safeKey}" data-start="${radioStart}" data-online="${isOnline}">00:00:00</b></div>
                    </div>`;
                container.appendChild(div);
            });

            updateLiveTimers();
        }

        function updateLiveTimers() {
            const agora = Date.now();
            document.querySelectorAll('[id^="ts-"]').forEach(elem => {
                const isOnline = elem.getAttribute('data-online') === 'true';
                const start = parseInt(elem.getAttribute('data-start') || agora);
                elem.innerText = isOnline ? formatMs(agora - start) : '00:00:00';
            });
            document.querySelectorAll('[id^="tr-"]').forEach(elem => {
                const isOnline = elem.getAttribute('data-online') === 'true';
                const start = parseInt(elem.getAttribute('data-start') || agora);
                elem.innerText = isOnline ? formatMs(agora - start) : '00:00:00';
            });
        }

        function formatMs(ms) {
            if (!ms || ms < 0) ms = 0;
            const totalSeg = Math.floor(ms / 1000);
            const h = Math.floor(totalSeg / 3600);
            const m = Math.floor((totalSeg % 3600) / 60);
            const s = totalSeg % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function deletarOuvinte(keyConta) {
            if(confirm(`Deseja excluir permanentemente o ouvinte "${keyConta}"?`)) {
                const updates = {};
                updates['contas/' + keyConta] = null;
                updates['ouvintes_preferencias/' + keyConta] = null;
                updates['ouvintes_online/' + keyConta] = null;

                db.ref().update(updates).then(() => {
                    alert("Ouvinte deletado!");
                });
            }
        }

        // LEITURA EM TEMPO REAL DOS NÓS DO BANCO DE DADOS
        db.ref('contas').on('value', snap => {
            rawContas = snap.val() || {};
            renderOuvintes();
        });

        db.ref('ouvintes_preferencias').on('value', snap => {
            rawPreferencias = snap.val() || {};
            renderOuvintes();
        });

        db.ref('ouvintes_online').on('value', snap => {
            rawOnlineState = snap.val() || {};
            renderOuvintes();
        });
    </script>
</body>
</html>
