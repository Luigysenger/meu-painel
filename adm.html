<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL ADM SUPREMO - LUIGY</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1DB954;
            --bg-dark: #000000;
            --card-bg: #121212;
            --card-inner: #181818;
            --text-light: #ffffff;
            --text-dim: #b3b3b3;
            --purple-off: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left h1 {
            font-size: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
        }

        .btn-header {
            background: #282828;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-header.sair { background: #e50914; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-mensagens {
            background: #e50914;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .relogio {
            font-size: 18px;
            font-weight: bold;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
            width: 100%;
        }

        .panel-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #282828;
        }

        .panel-title {
            font-size: 12px;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-dark {
            background: #282828;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-salvar {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .radio-card {
            aspect-ratio: 1.2;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            position: relative;
            cursor: pointer;
        }

        .radio-card-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 4px;
        }

        .radio-card-actions i {
            background: rgba(255,255,255,0.8);
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 9px;
        }

        .player-bar {
            background: #000;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #282828;
        }

        /* MONITOR DE OUVINTES - COMPACTO E DESLIZANTE NO CLIQUE */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-card {
            background: #18181c;
            border-radius: 8px;
            padding: 12px 15px;
            border-left: 4px solid var(--purple-off);
            cursor: pointer;
            transition: all 0.35s ease-in-out;
            overflow: hidden;
        }

        .user-card.online {
            border-left-color: var(--primary);
        }

        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-name {
            font-weight: 800;
            font-size: 13px;
            color: var(--purple-off);
            text-transform: uppercase;
        }

        .user-card.online .user-name {
            color: #ffffff;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 900;
        }

        .status-badge.on { color: var(--primary); }
        .status-badge.off { color: var(--purple-off); }

        .user-action-delete {
            color: #ff4444;
            margin-left: 10px;
            font-size: 11px;
        }

        /* ÁREA ENCOLHIDA QUE DESLIZA AO CLICAR */
        .expandable-content {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            pointer-events: none;
        }

        .user-card.expanded .expandable-content {
            max-height: 350px;
            opacity: 1;
            margin-top: 12px;
            pointer-events: auto;
        }

        .user-details {
            font-size: 11px;
            color: #aaa;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a32;
        }

        .user-details .radio-live {
            color: var(--primary);
            font-weight: bold;
        }

        .user-details .date-log {
            color: #d1a3ff;
            font-weight: bold;
        }

        /* ÁREA DO GRÁFICO EM PORCENTAGEM */
        .building-container {
            padding-top: 10px;
        }

        .building-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .building-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 100px;
            background: #101014;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #222;
        }

        .building-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            min-width: 55px;
            flex: 1;
        }

        .building-pct {
            font-size: 10px;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .building-bar {
            width: 100%;
            max-width: 26px;
            background: linear-gradient(180deg, #1DB954 0%, #09401b 100%);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.4s ease;
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.3);
        }

        .building-name {
            font-size: 8px;
            color: #aaa;
            margin-top: 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1><i class="fas fa-signal"></i> LUIGY ADM</h1>
            <button class="btn-header" onclick="location.reload()">REINICIAR</button>
            <button class="btn-header sair" onclick="logout()">SAIR</button>
        </div>
        <div class="header-right">
            <button class="btn-mensagens">MENSAGENS 0</button>
            <div class="relogio" id="hora">00:00:00</div>
        </div>
    </header>

    <div class="main-container">
        <div class="left-column">
            <div class="panel-box">
                <div class="panel-title">GERENCIAR EMISSORA</div>
                <div class="form-group">
                    <input type="hidden" id="r-key">
                    <input type="text" id="r-name" class="input-dark" placeholder="Nome da Rádio">
                    <input type="text" id="r-url" class="input-dark" placeholder="Link .mp3">
                    <button class="btn-salvar" id="btn-radio-action" onclick="addRadio()">SALVAR</button>
                </div>

                <div class="panel-title">GRADE DE RÁDIOS</div>
                <div class="radio-grid" id="radio-list"></div>

                <div class="player-bar">
                    <span id="now-title" style="font-size: 11px; color: #888;">SELECIONE UMA RÁDIO</span>
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <i class="fas fa-step-backward" onclick="prevRadio()" style="cursor:pointer"></i>
                        <i class="fas fa-play" id="play-icon" onclick="togglePlay()" style="cursor:pointer; background:#fff; color:#000; padding:10px; border-radius:50%"></i>
                        <i class="fas fa-step-forward" onclick="nextRadio()" style="cursor:pointer"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- MONITOR DE OUVINTES ENCOLHIDO COM DESLIZE AO CLICAR -->
        <div class="panel-box">
            <div class="panel-title">MONITOR DE OUVINTES</div>
            <div class="user-list" id="user-list"></div>
        </div>
    </div>

    <audio id="audio-player" style="display:none;"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-player');

        let radioData = [], activeIndex = -1, expandedCards = {};

        setInterval(() => {
            document.getElementById('hora').innerText = new Date().toLocaleTimeString('pt-BR');
            updateTimers();
        }, 1000);

        function logout() {
            localStorage.removeItem('usuarioNome');
            window.location.href = 'index.html';
        }

        // GRADE DE RÁDIOS
        db.ref('radios').on('value', snap => {
            radioData = [];
            snap.forEach(c => { radioData.push({ ...c.val(), key: c.key }); });
            const list = document.getElementById('radio-list');
            list.innerHTML = "";

            radioData.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = "radio-card";
                div.style.background = r.color || '#f3e1b7';
                div.innerHTML = `
                    <div class="radio-card-actions">
                        <i class="fas fa-pencil-alt" onclick="event.stopPropagation(); prepareEdit('${r.key}','${r.name}','${r.url}')"></i>
                        <i class="fas fa-times" onclick="event.stopPropagation(); deleteRadio('${r.key}')"></i>
                    </div>
                    <span>${r.name}</span>`;
                div.onclick = () => playRadio(i);
                list.appendChild(div);
            });
        });

        function addRadio() {
            const n = document.getElementById('r-name').value;
            const u = document.getElementById('r-url').value;
            const k = document.getElementById('r-key').value;
            if(!n || !u) return;
            if(k) { db.ref('radios/'+k).update({ name: n, url: u }); } 
            else { db.ref('radios').push({ name: n, url: u, color: '#d5e8d4' }); }
            document.getElementById('r-name').value = ""; document.getElementById('r-url').value = "";
        }

        function deleteRadio(k) { db.ref('radios/'+k).remove(); }
        function prepareEdit(k,n,u) { document.getElementById('r-key').value=k; document.getElementById('r-name').value=n; document.getElementById('r-url').value=u; }

        function playRadio(i) {
            activeIndex = i;
            player.src = radioData[i].url;
            player.play();
            document.getElementById('now-title').innerText = radioData[i].name;
        }

        function togglePlay() { player.paused ? player.play() : player.pause(); }
        function nextRadio() { if(radioData.length) playRadio((activeIndex+1)%radioData.length); }
        function prevRadio() { if(radioData.length) playRadio((activeIndex-1+radioData.length)%radioData.length); }

        // LÓGICA DE AUDIÊNCIA EM PORCENTAGEM E SLIDE EXPANSÍVEL
        db.ref('contas').on('value', snap => {
            const container = document.getElementById('user-list');
            container.innerHTML = "";
            const data = snap.val() || {};
            const agora = Date.now();

            for (let uid in data) {
                const u = data[uid];
                if(u.perfil === "adm") continue;

                const safeId = uid.replace(/[^a-zA-Z0-9]/g, '_');
                const isOnline = (u.status === 'online' && (agora - (u.lastSeen||0) < 45000));
                const isExpanded = !!expandedCards[safeId];
                
                // Formatação de data do visto por último
                const dataFormatada = u.lastSeen ? new Date(u.lastSeen).toLocaleString('pt-BR') : '---';

                const div = document.createElement('div');
                div.className = `user-card ${isOnline ? 'online' : ''} ${isExpanded ? 'expanded' : ''}`;
                div.onclick = () => toggleExpand(safeId);

                div.innerHTML = `
                    <div class="user-card-header">
                        <span class="user-name">${u.nome || 'Ouvinte'}</span>
                        <div>
                            <span class="status-badge ${isOnline ? 'on' : 'off'}">${isOnline ? '● ONLINE' : 'OFF'}</span>
                            <i class="fas fa-trash-alt user-action-delete" onclick="event.stopPropagation(); deleteUser('${uid}')"></i>
                        </div>
                    </div>
                    
                    <div class="expandable-content">
                        <div class="user-details">
                            <div>Acesso em: <span class="date-log">${dataFormatada}</span></div>
                            <div>Rádio Atual: <span class="radio-live">${isOnline && u.radioAtual ? u.radioAtual : '---'}</span></div>
                            <div>Tempo de Sessão: <b id="ts-${safeId}">00:00:00</b></div>
                            <div>Nesta Rádio: <b id="tr-${safeId}">00:00:00</b></div>
                        </div>
                        <div class="building-container">
                            <div class="building-title">
                                <span><i class="fas fa-chart-bar"></i> % Tempo em Cada Rádio</span>
                            </div>
                            <div class="building-chart" id="chart-${safeId}"></div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
            updateTimers();
        });

        function toggleExpand(safeId) {
            expandedCards[safeId] = !expandedCards[safeId];
            const cards = document.querySelectorAll('.user-card');
            db.ref('contas').once('value', () => {}); // Atualização em tempo real da visualização
        }

        function updateTimers() {
            const agora = Date.now();
            db.ref('contas').once('value', snap => {
                const data = snap.val() || {};
                for (let uid in data) {
                    const u = data[uid];
                    const safeId = uid.replace(/[^a-zA-Z0-9]/g, '_');
                    const isOnline = (u.status === 'online' && (agora - (u.lastSeen||0) < 45000));

                    if (isOnline) {
                        const elS = document.getElementById(`ts-${safeId}`);
                        const elR = document.getElementById(`tr-${safeId}`);
                        if(elS) elS.innerText = fmtMs(agora - (u.sessionStart || agora));
                        if(elR) elR.innerText = fmtMs(agora - (u.radioStart || agora));
                    }

                    // MONTAGEM DOS PRÉDIOS EM PORCENTAGEM (%)
                    const chartBox = document.getElementById(`chart-${safeId}`);
                    if (chartBox) {
                        const hist = u.historicoRadios || {};
                        const copyHist = { ...hist };

                        if(isOnline && u.radioAtual) {
                            copyHist[u.radioAtual] = (copyHist[u.radioAtual] || 0) + (agora - (u.radioStart || agora));
                        }

                        const keys = Object.keys(copyHist);
                        if(keys.length === 0) {
                            chartBox.innerHTML = `<span style="font-size:9px; color:#555">Sem dados de audiência salvos</span>`;
                            continue;
                        }

                        // Cálculo do Tempo Total acumulado em todas as rádios para extrair 100%
                        let tempoTotalMs = 0;
                        keys.forEach(k => { tempoTotalMs += copyHist[k]; });
                        if (tempoTotalMs <= 0) tempoTotalMs = 1;

                        let html = '';
                        keys.forEach(rName => {
                            const ms = copyHist[rName];
                            const pct = Math.round((ms / tempoTotalMs) * 100); // Cálculo da porcentagem real
                            const heightPct = Math.max(15, pct); // Mínimo de 15% para visualização da barra

                            html += `
                                <div class="building-wrapper">
                                    <span class="building-pct">${pct}%</span>
                                    <div class="building-bar" style="height:${heightPct}%"></div>
                                    <span class="building-name" title="${rName}">${rName}</span>
                                </div>
                            `;
                        });
                        chartBox.innerHTML = html;
                    }
                }
            });
        }

        function fmtMs(ms) {
            const s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000)%60, h = Math.floor(ms/3600000);
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function deleteUser(uid) { db.ref('contas/'+uid).remove(); }
    </script>
</body>
</html>
