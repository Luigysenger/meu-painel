<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - LUIGY ADM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header ADM */
    header {
      background: #1e1e24;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #29292e;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-header {
      background: #29292e;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .btn-header:hover {
      background: #323238;
    }

    /* Layout Principal */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar / Lista de Chat */
    .sidebar {
      width: 320px;
      background: #18181b;
      border-right: 1px solid #29292e;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      border-bottom: 1px solid #29292e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 15px;
      border-bottom: 1px solid #222226;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: #202024;
    }

    .chat-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .user-name {
      font-weight: bold;
      color: #fff;
    }

    .time-stamp {
      font-size: 0.75rem;
      color: #8d8d99;
    }

    /* Área do Chat */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #09090a;
    }

    .chat-header {
      padding: 15px 20px;
      background: #18181b;
      border-bottom: 1px solid #29292e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MENSAGENS DO CHAT - AJUSTE CIRÚRGICO SOLICITADO */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    /* Mensagem do OUVINTE: Agora alinhada à ESQUERDA */
    .message.msg-ouvinte, 
    .message.msg-recebida {
      align-self: flex-start;
      margin-right: auto;
      margin-left: 0;
      background-color: #202024;
      color: #e1e1e6;
      border-bottom-left-radius: 2px;
      border: 1px solid #29292e;
    }

    /* Mensagem do ADMIN (digitada pelo adm): Agora alinhada à DIREITA */
    .message.msg-admin, 
    .message.msg-enviada {
      align-self: flex-end;
      margin-left: auto;
      margin-right: 0;
      background-color: #00875f;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .msg-meta {
      font-size: 0.7rem;
      margin-top: 5px;
      opacity: 0.7;
      text-align: right;
    }

    /* Input do Chat */
    .chat-input-container {
      padding: 15px 20px;
      background: #18181b;
      border-top: 1px solid #29292e;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: #121214;
      border: 1px solid #29292e;
      border-radius: 6px;
      padding: 12px 15px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: #00e676;
    }

    .btn-send {
      background: #00e676;
      color: #000;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-send:hover {
      background: #00c853;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-user-shield"></i> LUIGY ADM
    </div>
    <div class="header-actions">
      <button class="btn-header"><i class="fa-solid fa-rotate-right"></i> REINICIAR</button>
      <button class="btn-header"><i class="fa-solid fa-right-from-bracket"></i> SAIR</button>
    </div>
  </header>

  <!-- Container Principal -->
  <div class="main-container">
    
    <!-- Sidebar de Ouvintes/Atendimentos -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>MENSAGENS DO OUVINTE</span>
        <button class="btn-header"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      </div>
      <div class="chat-list">
        <div class="chat-item active">
          <div class="chat-item-header">
            <span class="user-name">Ouvinte #1042</span>
            <span class="time-stamp">14:32</span>
          </div>
          <div style="font-size: 0.85rem; color: #8d8d99;">Gostaria de pedir uma música...</div>
        </div>
      </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="chat-area">
      <div class="chat-header">
        <div>
          <strong>Atendimento: Ouvinte #1042</strong>
        </div>
      </div>

      <!-- Feed de Mensagens Invertido Cirurgicamente -->
      <div class="chat-messages" id="chatFeed">
        
        <!-- Mensagem do Ouvinte (Respostas/Entrada -> Esquerda) -->
        <div class="message msg-ouvinte">
          Boa tarde! Toca a nova do Gusttavo Lima?
          <div class="msg-meta">14:30 - Ouvinte</div>
        </div>

        <!-- Mensagem do Administrador (Digitada pelo ADM -> Direita) -->
        <div class="message msg-admin">
          Olá! Boa tarde. Claro, já está na nossa programação!
          <div class="msg-meta">14:31 - ADM</div>
        </div>

        <!-- Resposta do Ouvinte (Esquerda) -->
        <div class="message msg-ouvinte">
          Muito obrigado, abraços!
          <div class="msg-meta">14:32 - Ouvinte</div>
        </div>

      </div>

      <!-- Input de Envio de Mensagem pelo ADM -->
      <form class="chat-input-container" onsubmit="enviarMensagemAdmin(event)">
        <input type="text" id="inputMsg" class="chat-input" placeholder="Digite sua resposta..." autocomplete="off">
        <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i> ENVIAR</button>
      </form>
    </main>

  </div>

  <script>
    function enviarMensagemAdmin(e) {
      e.preventDefault();
      const input = document.getElementById('inputMsg');
      const texto = input.value.trim();
      if (!texto) return;

      const chatFeed = document.getElementById('chatFeed');
      const msgDiv = document.createElement('div');
      
      // Aplica a classe da mensagem do Administrador (Direita)
      msgDiv.className = 'message msg-admin';
      
      const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      msgDiv.innerHTML = `${texto}<div class="msg-meta">${hora} - ADM</div>`;
      
      chatFeed.appendChild(msgDiv);
      input.value = '';
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }
  </script>
</body>
</html>
