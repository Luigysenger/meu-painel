<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - LMS de Rádios Online</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1DB954;
            --bg: #09090b;
            --card: rgba(18, 18, 20, 0.85);
            --text-muted: #a1a1aa;
            --purple-light: #c084fc;
            --border-glass: rgba(255, 255, 255, 0.08);
            --gray-border: #52525b;
            --gray-text: #71717a;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #f4f4f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-painel h1 {
            font-size: 18px;
            margin: 0;
            background: linear-gradient(135deg, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .btn-sair {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-sair:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .monitor-card {
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .monitor-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lista-ouvintes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Estilização do Card do Ouvinte conforme solicitado */
        .ouvinte-item {
            background: #161619;
            border-radius: 14px;
            padding: 15px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--gray-border);
        }

        .ouvinte-item.online {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(29, 185, 84, 0.25);
        }

        .ouvinte-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ouvinte-nome-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        /* Ícone de alto-falante piscando para ouvintes online */
        @keyframes piscarSpeaker {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .speaker-icon {
            color: var(--primary);
            animation: piscarSpeaker 1.2s infinite ease-in-out;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .status-badge.online {
            background: rgba(29, 185, 84, 0.15);
            color: var(--primary);
        }

        .status-badge.offline {
            background: rgba(113, 113, 122, 0.15);
            color: var(--gray-text);
        }

        /* Detalhes expansíveis ao clicar no ouvinte */
        .ouvinte-detalhes {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin-top 0.4s ease;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid transparent;
            margin-top: 0;
        }

        .ouvinte-item.expandido .ouvinte-detalhes {
            max-height: 150px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-glass);
        }

        .detalhe-linha {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .radio-destaque {
            color: var(--primary);
            font-weight: 700;
        }

        .sem-ouvintes {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-painel">
            <h1>Painel Administrativo - LMS Rádios</h1>
            <button class="btn-sair" onclick="sairPainel()">Sair do Painel</button>
        </div>

        <div class="monitor-card">
            <div class="monitor-title">
                <i class="fa-solid fa-users-viewfinder"></i> Monitor de Ouvintes em Tempo Real
            </div>
            <div class="lista-ouvintes" id="listaOuvintesContainer">
                <div class="sem-ouvintes">Carregando monitoramento...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sairPainel() {
            localStorage.removeItem('usuarioNome');
            window.location.href = "index.html";
        }

        // Função auxiliar para formatar segundos em HH:MM:SS
        function formatarTempo(totalSegundos) {
            if (!totalSegundos || isNaN(totalSegundos)) return "00:00:00";
            let h = Math.floor(totalSegundos / 3600);
            let m = Math.floor((totalSegundos % 3600) / 60);
            let s = totalSegundos % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Escuta contas cadastradas e estado de sessão/presença no Realtime Database
        db.ref('contas').on('value', snapshotContas => {
            const contas = snapshotContas.val() || {};
            
            db.ref('sessoes').on('value', snapshotSessoes => {
                const sessoes = snapshotSessoes.val() || {};
                renderizarMonitor(contas, sessoes);
            });
        });

        function renderizarMonitor(contas, sessoes) {
            const container = document.getElementById('listaOuvintesContainer');
            container.innerHTML = '';

            const chavesContas = Object.keys(contas);
            if (chavesContas.length === 0) {
                container.innerHTML = '<div class="sem-ouvintes">Nenhum ouvinte cadastrado no sistema.</div>';
                return;
            }

            // Monta lista unificando dados cadastrais com dados ativos de sessão
            let listaOuvintes = chavesContas.map(key => {
                const conta = contas[key];
                const sessao = sessoes[key] || {};
                
                return {
                    id: key,
                    nome: conta.nome || 'Usuário',
                    email: conta.email || '',
                    criadoEm: conta.criadoEm || 0,
                    online: sessao.online || false,
                    loginTimestamp: sessao.loginTimestamp || 0,
                    radioAtual: sessao.radioAtual || 'Nenhuma',
                    tempoRadioSegundos: sessao.tempoRadioSegundos || 0,
                    ultimaRadioSalva: sessao.ultimaRadioSalva || 'Nenhuma',
                    tempoSessaoCompletoSalvo: sessao.tempoSessaoCompletoSalvo || 0
                };
            });

            // Regras de Ordenação:
            // 1. Quem estiver online fica no topo, ordenados pela ordem de entrada (mais antigo online primeiro ou mais recente? "quando fizer login suba por ordem de entrada")
            // 2. Novos cadastros sem sessão ativa ficam sempre por último na cor cinza.
            listaOuvintes.sort((a, b) => {
                if (a.online && !b.online) return -1;
                if (!a.online && b.online) return 1;
                if (a.online && b.online) {
                    return a.loginTimestamp - b.loginTimestamp; // Ordem de entrada (primeiro a entrar fica acima)
                }
                // Offline / Nunca logados ordenados por data de cadastro (mais antigos primeiro, novos cadastrados por último)
                return a.criadoEm - b.criadoEm;
            });

            listaOuvintes.forEach(ouvinte => {
                const divItem = document.createElement('div');
                divItem.className = `ouvinte-item ${ouvinte.online ? 'online' : ''}`;
                divItem.id = `ouvinte-${ouvinte.id}`;

                // Cálculo em tempo real dos tempos para exibição fluida
                let tempoSessaoSegundos = 0;
                let tempoRadioAtualSegundos = ouvinte.tempoRadioSegundos;

                if (ouvinte.online && ouvinte.loginTimestamp) {
                    const agoraMS = Date.now();
                    tempoSessaoSegundos = Math.floor((agoraMS - ouvinte.loginTimestamp) / 1000);
                } else {
                    tempoSessaoSegundos = ouvinte.tempoSessaoCompletoSalvo;
                }

                const displayUltimaRadio = ouvinte.online ? ouvinte.radioAtual : ouvinte.ultimaRadioSalva;
                const displayTempoRadio = ouvinte.online ? tempoRadioAtualSegundos : ouvinte.tempoRadioSegundos;
                const displayTempoSessao = tempoSessaoSegundos;

                divItem.innerHTML = `
                    <div class="ouvinte-header">
                        <div class="ouvinte-nome-area">
                            ${ouvinte.online ? '<i class="fa-solid fa-volume-high speaker-icon"></i>' : '<i class="fa-solid fa-user" style="color: var(--gray-text);"></i>'}
                            <span>${ouvinte.nome}</span>
                        </div>
                        <div>
                            <span class="status-badge ${ouvinte.online ? 'online' : 'offline'}">
                                ${ouvinte.online ? 'online' : 'off'}
                            </span>
                        </div>
                    </div>
                    <div class="ouvinte-detalhes">
                        <div class="detalhe-linha">
                            <span>E-mail:</span> <strong>${ouvinte.email}</strong>
                        </div>
                        <div class="detalhe-linha">
                            <span>Rádio Atual / Última Ouvida:</span> <strong class="radio-destaque">${displayUltimaRadio}</strong>
                        </div>
                        <div class="detalhe-linha">
                            <span>Tempo de Sessão Completo:</span> <strong id="sessao-${ouvinte.id}">${formatarTempo(displayTempoSessao)}</strong>
                        </div>
                        <div class="detalhe-linha">
                            <span>Tempo Conectado nesta Rádio:</span> <strong id="radio-${ouvinte.id}">${formatarTempo(displayTempoRadio)}</strong>
                        </div>
                    </div>
                `;

                // Comportamento de clique para deslizar (expandir/recolher) os detalhes
                divItem.addEventListener('click', (e) => {
                    // Evita conflitos caso haja elementos internos clicáveis no futuro
                    document.querySelectorAll('.ouvinte-item').forEach(el => {
                        if (el !== divItem) el.classList.remove('expandido');
                    });
                    divItem.classList.toggle('expandido');
                });

                container.appendChild(divItem);
            });
        }

        // Timer global dinâmico na tela do Admin para atualizar os contadores de tempo segundo a segundo em tempo real
        setInterval(() => {
            db.ref('sessoes').once('value', snapshotSessoes => {
                const sessoes = snapshotSessoes.val() || {};
                const agoraMS = Date.now();

                Object.keys(sessoes).forEach(id => {
                    const sessao = sessoes[id];
                    if (sessao.online && sessao.loginTimestamp) {
                        const tSessao = Math.floor((agoraMS - sessao.loginTimestamp) / 1000);
                        const tRadio = (sessao.tempoRadioSegundos || 0) + 1; // Incrementa relógio da rádio ativa

                        // Atualiza direto no banco periodicamente ou atualiza o DOM visualmente de forma fluida
                        const elSessao = document.getElementById(`sessao-${id}`);
                        const elRadio = document.getElementById(`radio-${id}`);
                        if (elSessao) elSessao.innerText = formatarTempo(tSessao);
                        if (elRadio) {
                            elRadio.innerText = formatarTempo(tRadio);
                            // Sincroniza o incremento levemente no banco de dados para persistência do tempo da rádio
                            if (Math.random() < 0.3) { // Evita escrita excessiva a cada 1 segundo exato, atualizando a cada poucos ciclos
                                db.ref(`sessoes/${id}`).update({ tempoRadioSegundos: tRadio });
                            }
                        }
                    }
                });
            });
        }, 1000);
    </script>
</body>
</html>
