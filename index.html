<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIN - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        *, *::before, *::after { box-sizing: border-box !important; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #121212;
            border: 1px solid #282828;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            color: #A020F0;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.sub {
            color: #777;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .field-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .input-login {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            padding: 12px 15px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-login:focus {
            border-color: #A020F0;
            box-shadow: 0 0 10px rgba(160, 32, 240, 0.3);
        }

        .btn-entrar {
            width: 100%;
            background: #A020F0;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background: #b23bf2;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.5);
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .toggle-link span {
            color: #FFB6C1;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="titulo-form">BEM-VINDO</h2>
        <p class="sub" id="sub-form">Informe seus dados para acessar o painel</p>

        <form id="form-login" onsubmit="processarAcao(event)">
            <div class="field-group" id="group-nome" style="display: none;">
                <label>SEU NOME COMPLETO</label>
                <input type="text" id="nome-cadastro" class="input-login" placeholder="Ex: João Silva">
            </div>

            <div class="field-group">
                <label>NOME DE USUÁRIO / E-MAIL</label>
                <input type="text" id="usuario" class="input-login" placeholder="Digite seu usuário ou e-mail" required>
            </div>

            <div class="field-group">
                <label>SENHA</label>
                <input type="password" id="senha" class="input-login" placeholder="••••••" required>
            </div>

            <button type="submit" id="btn-submit" class="btn-entrar">ENTRAR NO PAINEL</button>
        </form>

        <div class="toggle-link" id="box-toggle">
            Não tem uma conta? <span onclick="mudarModo('cadastro')">Criar nova conta</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let modoAtual = 'login';

        function mudarModo(modo) {
            modoAtual = modo;
            if (modo === 'cadastro') {
                document.getElementById('titulo-form').innerText = "CRIAR CONTA";
                document.getElementById('sub-form').innerText = "Preencha os dados abaixo para se cadastrar";
                document.getElementById('group-nome').style.display = "block";
                document.getElementById('btn-submit').innerText = "CRIAR MINHA CONTA";
                document.getElementById('box-toggle').innerHTML = 'Já possui uma conta? <span onclick="mudarModo(\'login\')">Fazer Login</span>';
            } else {
                document.getElementById('titulo-form').innerText = "BEM-VINDO";
                document.getElementById('sub-form').innerText = "Informe seus dados para acessar o painel";
                document.getElementById('group-nome').style.display = "none";
                document.getElementById('btn-submit').innerText = "ENTRAR NO PAINEL";
                document.getElementById('box-toggle').innerHTML = 'Não tem uma conta? <span onclick="mudarModo(\'cadastro\')">Criar nova conta</span>';
            }
        }

        function processarAcao(event) {
            event.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const senhaInput = document.getElementById('senha').value.trim();
            const nomeInput = document.getElementById('nome-cadastro').value.trim();
            const userLower = usuarioInput.toLowerCase();

            // ROTA DE ENTRADA DO ADMINISTRADOR
            if (userLower === 'admin' || userLower === 'senger.luigy@gmail.com') {
                localStorage.setItem('userId', 'admin');
                localStorage.setItem('usuarioNome', 'ADMINISTRADOR');
                window.location.href = 'adm.html';
                return;
            }

            // MODO DE CADASTRO DE OUVINTE
            if (modoAtual === 'cadastro') {
                if (!nomeInput) return alert("Por favor, digite seu nome!");

                const idUser = 'ouvinte_' + Date.now();
                db.ref('contas/' + idUser).set({
                    nome: nomeInput,
                    usuario: usuarioInput,
                    senha: senhaInput,
                    status: "online",
                    criadoEm: new Date().toLocaleString('pt-BR')
                }).then(() => {
                    localStorage.setItem('userId', idUser);
                    localStorage.setItem('usuarioNome', nomeInput);
                    window.location.href = 'ouvinte.html';
                });
            } else {
                // MODO DE LOGIN DE OUVINTE
                const idUser = userLower.replace(/[^a-z0-9]/g, '_');
                localStorage.setItem('userId', idUser);
                localStorage.setItem('usuarioNome', usuarioInput);
                window.location.href = 'ouvinte.html';
            }
        }
    </script>
</body>
</html>
