<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIN - PAINEL LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        *, *::before, *::after { box-sizing: border-box !important; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #121212;
            border: 1px solid #282828;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            color: #A020F0;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.sub {
            color: #777;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .field-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .input-login {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            padding: 12px 15px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-login:focus {
            border-color: #A020F0;
            box-shadow: 0 0 10px rgba(160, 32, 240, 0.3);
        }

        .btn-entrar {
            width: 100%;
            background: #A020F0;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background: #b23bf2;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.5);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>BEM-VINDO</h2>
        <p class="sub">Informe seus dados para acessar o painel</p>

        <form id="form-login" onsubmit="realizarLogin(event)">
            <div class="field-group">
                <label>NOME DE USUÁRIO / E-MAIL</label>
                <input type="text" id="usuario" class="input-login" placeholder="Digite seu usuário ou e-mail" required>
            </div>

            <div class="field-group">
                <label>SENHA</label>
                <input type="password" id="senha" class="input-login" placeholder="••••••" required>
            </div>

            <button type="submit" class="btn-entrar">ENTRAR NO PAINEL</button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function realizarLogin(event) {
            event.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const senhaInput = document.getElementById('senha').value.trim();

            if (!usuarioInput || !senhaInput) {
                alert("Preencha todos os campos!");
                return;
            }

            const userLower = usuarioInput.toLowerCase();

            // VERIFICAÇÃO SE É O ADMINISTRADOR
            if (userLower === 'admin' || userLower === 'senger.luigy@gmail.com') {
                localStorage.setItem('userId', 'admin');
                localStorage.setItem('usuarioNome', 'ADMINISTRADOR');
                window.location.href = 'adm.html';
            } else {
                // ENTRADA COMO OUVINTE
                const idFormatado = userLower.replace(/[^a-z0-9]/g, '_');
                localStorage.setItem('userId', idFormatado);
                localStorage.setItem('usuarioNome', usuarioInput);
                window.location.href = 'ouvinte.html';
            }
        }
    </script>
</body>
</html>
