<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* Layout */
        .sidebar { width: 250px; background: var(--card); padding: 20px; border-right: 1px solid #334155; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Player Style */
        .player-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .controls { display: flex; align-items: center; gap: 20px; }
        .btn { background: var(--primary); border: none; color: white; padding: 15px 20px; border-radius: 50%; cursor: pointer; }

        /* Chat */
        .chat-box { flex: 1; background: var(--card); border-radius: 10px; padding: 15px; overflow-y: auto; }
        .chat-bubble-ouvinte { margin-bottom: 10px; background: #334155; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Menu</h2>
        <button onclick="alert('Funcionalidade de Loja em breve!')">Loja Virtual</button>
    </div>

    <div class="main-content">
        <div class="player-card">
            <h2 id="player-title">Nenhuma rádio selecionada</h2>
            <div class="controls">
                <button class="btn" onclick="togglePlay()" id="btn-play"><i class="fas fa-play"></i></button>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>

        <div class="chat-box" id="lista-respostas-adm"></div>
        <div class="input-area">
            <input type="text" id="texto-mensagem" placeholder="Digite algo...">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            databaseURL: "SUA_DATABASE_URL",
            projectId: "SEU_PROJECT_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variáveis de Estado
        let player = new Audio();
        let isRadioTocando = false;
        let ouvinteNome = "Ouvinte_" + Math.floor(Math.random() * 1000);

        function togglePlay() {
            if (isRadioTocando) {
                player.pause();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-play"></i>';
            } else {
                // Exemplo de stream de teste
                player.src = "https://c1.popcast.com.br:9000/live"; 
                player.play();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
            }
            isRadioTocando = !isRadioTocando;
        }

        function enviarMensagem() {
            const input = document.getElementById('texto-mensagem');
            if (!input.value.trim()) return;
            
            db.ref('mensagens_ouvintes').push({
                ouvinte: ouvinteNome,
                texto: input.value,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = "";
        }

        // Listener de mensagens em tempo real
        db.ref('mensagens_ouvintes').limitToLast(5).on('value', snap => {
            const container = document.getElementById('lista-respostas-adm');
            container.innerHTML = "";
            snap.forEach(child => {
                const msg = child.val();
                container.innerHTML += `<div class="chat-bubble-ouvinte"><b>${msg.ouvinte}:</b> ${msg.texto}</div>`;
            });
        });
    </script>
</body>
</html>
