<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL OUVINTE - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :root { 
            --primary: #A020F0; 
            --pink-light: #FFB6C1; 
            --bg: #000; 
            --card: #121212; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #121212; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 1200px; 
        }

        .header h2 { 
            margin: 0; 
            color: var(--primary); 
            font-size: 26px; 
            font-weight: 900;
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        /* NOME DO USUÁRIO COM FONTE MAIOR */
        .user-name-title {
            font-size: 16px !important;
            font-weight: bold;
            color: #ddd;
            margin-top: 4px;
            display: block;
        }

        /* CONTAINER DOS WIDGETS DO HEADER */
        .header-widgets {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ccc;
        }

        .widget-item {
            background: #1e1e1e;
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* RELÓGIO COM FONTE AUMENTADA */
        .relogio-box {
            font-size: 18px !important;
            font-weight: bold;
            color: #fff;
        }

        /* CLIMA COM FONTE AUMENTADA */
        .clima-box {
            font-size: 16px !important;
            font-weight: bold;
            color: #fff;
        }

        /* BOTÃO SAIR AUMENTADO */
        .btn-sair { 
            background: rgba(255, 68, 68, 0.1); 
            border: 2px solid #ff4444; 
            color: #ff4444; 
            padding: 10px 18px !important; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 14px !important; 
            font-weight: 900; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sair:hover {
            background: #ff4444;
            color: #fff;
        }

        .frase-centro-playlist {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0 20px 0;
            width: 100%;
            max-width: 1200px;
            background: linear-gradient(90deg, transparent, #15002b, transparent);
            padding: 10px;
            border-radius: 10px;
        }

        .main-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 140px; 
            align-items: start;
        }

        .card-box { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid #282828; 
            width: 100%; 
        }

        h3 { 
            color: var(--primary); 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 20px; 
            text-align: center; 
            line-height: 1.4;
        }

        .banner-destaque-adm {
            background: #f0e6ff;
            color: #2a004f;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(160, 32, 240, 0.3);
        }

        .radios-section-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .radios-section-container {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .header-widgets {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        .catalogo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-radio-catalogo {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }

        .bar-radio-catalogo.adicionada {
            background: #d8b4fe !important;
            color: #2e0054 !important;
            border-color: #a855f7 !important;
        }

        .bar-radio-catalogo .btn-add-icon {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playlist-grid-ouvinte {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
            min-height: 120px;
        }

        .radio-card-quadrado {
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            cursor: grab;
            color: #000;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s, border 0.3s;
            position: relative;
            border: 2px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .radio-card-quadrado:active {
            cursor: grabbing;
        }

        .radio-card-quadrado.playing {
            background: #151515 !important;
            color: #fff !important;
            border-color: #00ff66 !important;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .radio-card-quadrado i.icon-radio {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .antena-piscando {
            color: #00ff66;
            font-size: 24px !important;
            animation: piscar 1s infinite alternate;
        }

        @keyframes piscar {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .radio-card-quadrado .radio-name {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.2;
            word-break: break-word;
        }

        .input-msg { 
            width: 100%; 
            background: #0a0a0a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            padding: 12px; 
            margin-bottom: 10px; 
            outline: none; 
            resize: none;
        }

        .btn-enviar { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
        }

        .msg-item {
            background: #181818;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
            position: relative;
        }

        .btn-delete-msg {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            transition: 0.2s;
        }

        .btn-delete-msg:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .resp-adm-box {
            background: #25122e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 3px solid var(--pink-light);
        }

        .player-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #111; 
            padding: 12px 20px; 
            border-top: 2px solid var(--primary); 
            z-index: 100; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 8px;
        }

        .player-info { text-align: center; }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn-control-step {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-control-step:hover {
            background: #333;
            border-color: var(--primary);
        }

        .btn-play {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(160, 32, 240, 0.5);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>PAINEL DO OUVINTE</h2>
            <span id="nome-ouvinte-display" class="user-name-title"></span>
        </div>

        <!-- CLIMA E HORA AUMENTADOS E DINÂMICOS -->
        <div class="header-widgets">
            <div class="widget-item">
                <i class="far fa-clock" style="color: var(--primary); font-size: 20px;"></i>
                <span id="relogio-digital" class="relogio-box">00:00:00</span>
            </div>
            
            <div class="widget-item">
                <span id="icone-clima-dinamico"><i class="fas fa-sun" style="color: #ffcc00; font-size: 20px;"></i></span>
                <span id="clima-cidade" class="clima-box">Carregando clima...</span>
            </div>
            
            <button class="btn-sair" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> SAIR
            </button>
        </div>
    </div>

    <!-- FRASE CENTRO -->
    <div class="frase-centro-playlist">
        curta sua playliste de radio
    </div>

    <div class="main-container">

        <!-- SEÇÃO DE SELEÇÃO E PLAYLIST DE RÁDIOS -->
        <div class="card-box">
            <h3>GERENCIAR SUAS RÁDIOS PREFERIDAS</h3>
            
            <div class="radios-section-container">
                <div>
                    <h3 style="font-size: 10px; text-align: left; color: #aaa;">1. ADICIONE RÁDIOS</h3>
                    <div id="catalogo-radios" class="catalogo-list"></div>
                </div>

                <div>
                    <h3 style="font-size: 10px; text-align: left; color: #aaa;">2. SUA PLAYLIST (ARRASTE)</h3>
                    <div id="grid-playlist" class="playlist-grid-ouvinte"></div>
                </div>
            </div>
        </div>

        <!-- ENVIAR MENSAGENS E VER RESPOSTAS DO ADM -->
        <div class="card-box">
            <div class="banner-destaque-adm">
                MANDE MENSAGEM PARA O ADM PARA PEDIR PARA ADICIONAR UMA RADIO QUE VC GOSTE
            </div>

            <textarea id="texto-mensagem" class="input-msg" rows="3" placeholder="Escreva seu recado ou pedido de rádio aqui..."></textarea>
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar Mensagem</button>

            <h3 style="margin-top: 25px;">SUAS MENSAGENS E RESPOSTAS</h3>
            <div id="lista-respostas-adm"></div>
        </div>

    </div>

    <!-- PLAYER FOOTER -->
    <div class="player-footer">
        <div class="player-info">
            <div id="player-title" style="font-size: 13px; font-weight: bold; color: #fff;">Nenhuma rádio selecionada</div>
        </div>
        
        <div class="player-controls">
            <button class="btn-control-step" title="Rádio Anterior" onclick="mudarRadio(-1)">
                <i class="fas fa-step-backward"></i>
            </button>
            
            <button id="btn-play" class="btn-play" onclick="togglePlay()">
                <i class="fas fa-play"></i>
            </button>
            
            <button class="btn-control-step" title="Próxima Rádio" onclick="mudarRadio(1)">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
    </div>

    <audio id="audio-ouvinte"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-ouvinte');

        const ouvinteId = localStorage.getItem('userId') || ('ouvinte_' + Date.now());
        
        let ouvinteNome = localStorage.getItem('usuarioNome') || localStorage.getItem('usuarioEmail') || 'Ouvinte Anônimo';
        if (ouvinteNome.includes('@')) {
            ouvinteNome = ouvinteNome.split('@')[0];
        }
        document.getElementById('nome-ouvinte-display').innerText = "Olá, " + ouvinteNome;

        // RELÓGIO DIGITAL
        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio-digital').innerText = agora.toLocaleTimeString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // OBTER CLIMA E CIDADE POR IP COM ÍCONES DINÂMICOS
        async function carregarClimaPorIP() {
            try {
                const resGeo = await fetch('https://ipapi.co/json/');
                const geoData = await resGeo.json();
                
                if (geoData.latitude && geoData.longitude) {
                    const lat = geoData.latitude;
                    const lon = geoData.longitude;
                    const cidade = geoData.city || 'Sua Cidade';

                    const resClima = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const climaData = await resClima.json();
                    
                    if (climaData.current_weather) {
                        const temp = Math.round(climaData.current_weather.temperature);
                        const code = climaData.current_weather.weathercode;

                        // SELEÇÃO DO ÍCONE COM BASE NO CÓDIGO METEOROLÓGICO
                        let iconeHTML = '<i class="fas fa-sun" style="color: #ffcc00; font-size: 20px;"></i>'; // Sol padrão

                        if (code === 0 || code === 1) {
                            // Ensolarado / Céu Limpo
                            iconeHTML = '<i class="fas fa-sun" style="color: #ffcc00; font-size: 20px;"></i>';
                        } else if (code === 2 || code === 3) {
                            // Parcialmente Nublado / Sol com Nuvem
                            iconeHTML = '<i class="fas fa-cloud-sun" style="color: #ffbb00; font-size: 20px;"></i>';
                        } else if (code >= 51 && code <= 99) {
                            // Chuva / Garoa / Tempestade
                            iconeHTML = '<i class="fas fa-cloud-showers-heavy" style="color: #00ccff; font-size: 20px;"></i>';
                        } else if (code === 45 || code === 48) {
                            // Nevoeiro / Nublado Denso
                            iconeHTML = '<i class="fas fa-cloud" style="color: #aaaaaa; font-size: 20px;"></i>';
                        }

                        document.getElementById('icone-clima-dinamico').innerHTML = iconeHTML;
                        document.getElementById('clima-cidade').innerText = `${cidade}: ${temp}°C`;
                    }
                } else {
                    document.getElementById('clima-cidade').innerText = "Indisponível";
                }
            } catch (e) {
                document.getElementById('clima-cidade').innerText = "Clima indisponível";
            }
        }
        carregarClimaPorIP();

        let todasRadios = [];
        let playlistKeys = JSON.parse(localStorage.getItem('playlist_keys_ouvinte') || '[]');
        let radioTocandoKey = null;

        // CARREGAR RÁDIOS DO FIREBASE
        db.ref('radios').on('value', snap => {
            todasRadios = [];
            snap.forEach(child => {
                todasRadios.push({ key: child.key, ...child.val() });
            });

            todasRadios.sort((a, b) => (a.posicao || 0) - (b.posicao || 0));

            if (!localStorage.getItem('playlist_iniciada')) {
                playlistKeys = todasRadios.map(r => r.key);
                localStorage.setItem('playlist_keys_ouvinte', JSON.stringify(playlistKeys));
                localStorage.setItem('playlist_iniciada', 'true');
            }

            renderizarPainelRadios();
        });

        function renderizarPainelRadios() {
            renderizarCatologoEsquerda();
            renderizarPlaylistDireita();
        }

        function renderizarCatologoEsquerda() {
            const container = document.getElementById('catalogo-radios');
            container.innerHTML = "";

            if (todasRadios.length === 0) {
                container.innerHTML = "<p style='color:#666; font-size:11px;'>Nenhuma rádio cadastrada.</p>";
                return;
            }

            todasRadios.forEach(r => {
                const estaNaPlaylist = playlistKeys.includes(r.key);

                container.innerHTML += `
                    <div class="bar-radio-catalogo ${estaNaPlaylist ? 'adicionada' : ''}" onclick="togglePlaylistRadio('${r.key}')">
                        <span class="btn-add-icon"><i class="fas ${estaNaPlaylist ? 'fa-check' : 'fa-plus'}"></i></span>
                        <span>${r.name}</span>
                    </div>
                `;
            });
        }

        function renderizarPlaylistDireita() {
            const container = document.getElementById('grid-playlist');
            container.innerHTML = "";

            const radiosPlaylist = playlistKeys
                .map(key => todasRadios.find(r => r.key === key))
                .filter(Boolean);

            if (radiosPlaylist.length === 0) {
                container.innerHTML = "<p style='color:#666; font-size:11px; grid-column: 1/-1; text-align:center; padding: 20px;'>Clique no '+' ao lado para montar sua playlist!</p>";
                return;
            }

            radiosPlaylist.forEach((r, idx) => {
                const isPlaying = (radioTocandoKey === r.key);
                const cardColor = r.color || '#d1a3ff';

                container.innerHTML += `
                    <div class="radio-card-quadrado ${isPlaying ? 'playing' : ''}" 
                         style="background: ${cardColor};" 
                         data-key="${r.key}"
                         onclick="tocarRadioPorKey('${r.key}')">
                        <i class="fas ${isPlaying ? 'fa-tower-broadcast antena-piscando' : 'fa-radio'} icon-radio"></i>
                        <span class="radio-name">${r.name}</span>
                    </div>
                `;
            });
        }

        function togglePlaylistRadio(key) {
            const index = playlistKeys.indexOf(key);
            if (index > -1) {
                playlistKeys.splice(index, 1);
            } else {
                playlistKeys.push(key);
            }

            localStorage.setItem('playlist_keys_ouvinte', JSON.stringify(playlistKeys));
            renderizarPainelRadios();
        }

        new Sortable(document.getElementById('grid-playlist'), {
            animation: 150,
            delay: 100,
            delayOnTouchOnly: true,
            onEnd: function() {
                const novaOrdem = [];
                document.querySelectorAll('#grid-playlist .radio-card-quadrado').forEach(el => {
                    novaOrdem.push(el.getAttribute('data-key'));
                });

                playlistKeys = novaOrdem;
                localStorage.setItem('playlist_keys_ouvinte', JSON.stringify(playlistKeys));
            }
        });

        function tocarRadioPorKey(key) {
            const radio = todasRadios.find(r => r.key === key);
            if (!radio) return;

            if (radioTocandoKey === key) {
                togglePlay();
            } else {
                radioTocandoKey = key;
                player.src = radio.url;
                player.play().catch(() => {});
                document.getElementById('player-title').innerText = radio.name;
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
                renderizarPlaylistDireita();
            }
        }

        function mudarRadio(direcao) {
            const radiosPlaylist = playlistKeys
                .map(key => todasRadios.find(r => r.key === key))
                .filter(Boolean);

            if (radiosPlaylist.length === 0) return;

            let currentIndex = radiosPlaylist.findIndex(r => r.key === radioTocandoKey);
            let nextIndex = currentIndex + direcao;

            if (nextIndex >= radiosPlaylist.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = radiosPlaylist.length - 1;

            tocarRadioPorKey(radiosPlaylist[nextIndex].key);
        }

        function togglePlay() {
            if (!player.src) return;
            if (player.paused) {
                player.play();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                player.pause();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function enviarMensagem() {
            const texto = document.getElementById('texto-mensagem').value.trim();
            if (!texto) return alert("Digite sua mensagem!");

            db.ref('mensagens_ouvintes').push({
                ouvinteId: ouvinteId,
                ouvinte: ouvinteNome,
                mensagem: texto,
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert("Mensagem enviada com sucesso!");
                document.getElementById('texto-mensagem').value = "";
            });
        }

        function deletarMensagem(msgKey) {
            if (confirm("Deseja apagar esta mensagem?")) {
                db.ref('mensagens_ouvintes/' + msgKey).remove();
            }
        }

        db.ref('respostas_adm').on('value', snapResps => {
            const respostas = snapResps.val() || {};

            db.ref('mensagens_ouvintes').on('value', snapMsgs => {
                const container = document.getElementById('lista-respostas-adm');
                container.innerHTML = "";
                const msgs = snapMsgs.val() || {};

                let temItem = false;

                for (let id in msgs) {
                    const m = msgs[id];
                    if (m.ouvinteId === ouvinteId || m.ouvinte === ouvinteNome) {
                        temItem = true;
                        let htmlMsg = `
                            <div class="msg-item">
                                <button class="btn-delete-msg" title="Apagar Mensagem" onclick="deletarMensagem('${id}')">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                                <div style="font-size:10px; color:#aaa; margin-bottom: 3px;">Você enviou (${m.dataHora || ''}):</div>
                                <div style="font-size:13px; padding-right: 25px;">${m.mensagem}</div>
                        `;

                        for (let rId in respostas) {
                            const r = respostas[rId];
                            if (r.ouvinteId === ouvinteId || r.ouvinte === ouvinteNome) {
                                htmlMsg += `
                                    <div class="resp-adm-box">
                                        <div style="font-size:10px; color: var(--pink-light); font-weight:bold;">Resposta do ADM (${r.dataHora || ''}):</div>
                                        <div style="font-size:13px; margin-top:2px;">${r.resposta}</div>
                                    </div>
                                `;
                            }
                        }

                        htmlMsg += `</div>`;
                        container.innerHTML += htmlMsg;
                    }
                }

                if (!temItem) {
                    container.innerHTML = "<p style='color:#666; text-align:center; font-size:12px;'>Você ainda não enviou mensagens.</p>";
                }
            });
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
