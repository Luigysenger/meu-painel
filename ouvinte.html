<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player com Ludigins</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .user-info {
            margin-top: 15px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .timer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .listener-name {
            font-weight: bold;
            color: #1db954;
        }
        .timer-label {
            color: #aaaaaa;
        }
        .alert-message {
            color: #ffcc00;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Radio ao Vivo</h2>
        <!-- Substitua o src pelo link do seu stream -->
        <audio id="radioPlayer" controls>
            <source src="https://your-radio-stream-url.com/stream" type="audio/mpeg">
            Seu navegador nao suporta o elemento de audio.
        </audio>

        <div class="user-info">
            <div class="timer-row">
                <span class="listener-name" id="listenerName">Ouvinte: Joao</span>
                <span class="timer-label">cronometro de ludigins:</span>
                <span id="cronometroludigins">00:00:00</span>
            </div>
            <div id="alertBox" class="alert-message"></div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('radioPlayer');
        const timerDisplay = document.getElementById('cronometroludigins');
        const alertBox = document.getElementById('alertBox');

        let secondsElapsed = 0;
        let timerInterval = null;
        let isPlaying = false;

        // Tempo alvo em segundos
        // Para testes rapidos, voce pode alterar estes valores
        // Exemplo: 5 minutos = 300 segundos, 3 minutos = 180 segundos
        const targetFirstLudigin = 300; // 5 minutos antes do primeiro ludigin
        const targetDouble = 180;       // 3 minutos antes de dobrar

        function formatTime(totalSeconds) {
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateTimer() {
            if (isPlaying) {
                secondsElapsed++;
                timerDisplay.textContent = formatTime(secondsElapsed);

                // Logica das mensagens corrigidas
                // Faltando 5 minutos para o primeiro ludigin (considerando a meta total do primeiro ludigin em 300s + 300s = 600s por exemplo, 
                // ou ajustando para o momento exato em que restam 5 minutos / 300 segundos para a conquista)
                
                // Vamos acionar a mensagem quando faltarem 5 minutos (300 segundos) para o primeiro ludigin
                let tempoRestantePrimeiro = targetFirstLudigin - secondsElapsed;
                
                if (tempoRestantePrimeiro === 0 || (secondsElapsed >= (targetFirstLudigin - 300) && secondsElapsed < targetFirstLudigin)) {
                    // Se faltam 5 minutos (300 segundos) exatos ou faixa equivalente baseada na sua regra:
                    // Ajuste para disparar exatamente quando faltarem 5 minutos (300 segundos) para a pessoa faturar
                }

                // Aplicando as mensagens exatamente como solicitadas:
                // Quando faltarem 5 minutos para o primeiro ludigin (ex: se o primeiro ludigin for com 10 min, aos 5 min aparece a mensagem)
                // Ou interpretando direto o seu pedido: "faltam 5 minutos... ei ligadao, mais 5 minutos ouvindo voce fatura seu primeiro ludgins"
                if (secondsElapsed === (targetFirstLudigin - 300) && targetFirstLudigin - 300 >= 0) {
                    alertBox.textContent = "Ei ligadao, mais 5 minutos ouvindo voce fatura seu primeiro ludgins";
                } 
                // Apos isso ou quando faltar para dobrar: "ei ligadao, mais 3 minutos vc pode dobrar seus ludigins"
                else if (secondsElapsed === (targetDouble - 180) && targetDouble - 180 >= 0) {
                    alertBox.textContent = "Ei ligadao, mais 3 minutos vc pode dobrar seus ludigins";
                }

                // Exemplo pratico alternativo direto baseado no tempo atual do contador se a meta for direta:
                // Caso queira que apareça com X tempo de conexao:
                if (secondsElapsed === 300) { // Exemplo aos 5 minutos de player ligado
                    alertBox.textContent = "Ei ligadao, mais 5 minutos ouvindo voce fatura seu primeiro ludgins";
                } else if (secondsElapsed === 600) { // Exemplo aos 10 minutos
                    alertBox.textContent = "Ei ligadao, mais 3 minutos vc pode dobrar seus ludigins";
                }
            }
        }

        audioPlayer.addEventListener('play', () => {
            if (!isPlaying) {
                isPlaying = true;
                timerInterval = setInterval(updateTimer, 1000);
            }
        });

        audioPlayer.addEventListener('pause', () => {
            isPlaying = false;
            clearInterval(timerInterval);
        });

        audioPlayer.addEventListener('ended', () => {
            isPlaying = false;
            clearInterval(timerInterval);
        });
    </script>
</body>
</html>
