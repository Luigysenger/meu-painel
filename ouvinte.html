<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #a855f7;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .painel-container {
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 18px;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Seção de Esportes / Jogos */
        .secao-esportes {
            margin-top: 20px;
        }

        .jogo-card-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .campeonato-badge-jogo {
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
        }

        .jogo-header-info {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 11px;
        }

        .live-tag-badge {
            color: #ef4444;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        .jogo-placares-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }

        .time-nome-box {
            width: 38%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .placar-central-num {
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="painel-container">
        <h2><i class="fas fa-futbol"></i> Próximos Jogos - Brasileirão</h2>
        
        <!-- Container onde os jogos serão injetados -->
        <div id="lista-jogos-esportes" class="secao-esportes">
            <!-- Conteúdo carregado via JavaScript -->
        </div>
    </div>

    <script>
        const API_KEY_FOOTBALL = "ef1aa464f6bacacd0ff6d26c8179aee0";

        async function carregarJogosBrasileiraoSemana() {
            const containerEsportes = document.getElementById('lista-jogos-esportes');
            containerEsportes.innerHTML = `<p style="color:#a855f7; font-size:11.5px; text-align:center; margin:10px 0;"><i class="fas fa-spinner fa-spin"></i> Buscando próximos jogos...</p>`;

            try {
                // Buscando os próximos jogos agendados para a liga do Brasileirão (ID 71) na temporada 2026
                const response = await fetch("https://v3.football.api-sports.io/fixtures?league=71&season=2026&next=5", {
                    method: "GET",
                    headers: {
                        "x-apisports-key": API_KEY_FOOTBALL
                    }
                });

                const data = await response.json();
                
                if (!data.response || data.response.length === 0) {
                    containerEsportes.innerHTML = `<p style="color:#888; font-size:11.5px; text-align:center; margin:10px 0;">Nenhum jogo agendado no momento.</p>`;
                    return;
                }

                let htmlJogos = "";
                data.response.forEach(item => {
                    const jogo = item.fixture;
                    const teams = item.teams;
                    const goals = item.goals;
                    const league = item.league;

                    const statusShort = jogo.status.short;
                    const dataJogo = new Date(jogo.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    
                    const isLive = statusShort === "1H" || statusShort === "2H" || statusShort === "HT";
                    const isFinished = statusShort === "FT";

                    let statusBadge = `<span>${dataJogo}</span>`;
                    if (isLive) {
                        statusBadge = `<span class="live-tag-badge"><i class="fas fa-circle"></i> AO VIVO</span>`;
                    } else if (isFinished) {
                        statusBadge = `<span style="color:#9ca3af;">Encerrado</span>`;
                    }

                    htmlJogos += `
                        <div class="jogo-card-item">
                            <div>
                                <span class="campeonato-badge-jogo"><i class="fas fa-trophy" style="font-size: 8.5px; margin-right: 3px;"></i> ${league.name}</span>
                            </div>
                            <div class="jogo-header-info">
                                <span><i class="far fa-clock"></i> ${dataJogo}</span>
                                ${statusBadge}
                            </div>
                            <div class="jogo-placares-row">
                                <span class="time-nome-box home" title="${teams.home.name}">${teams.home.name}</span>
                                <span class="placar-central-num">${isLive || isFinished ? (goals.home ?? 0) + ' x ' + (goals.away ?? 0) : 'VS'}</span>
                                <span class="time-nome-box away" title="${teams.away.name}">${teams.away.name}</span>
                            </div>
                        </div>
                    `;
                });

                containerEsportes.innerHTML = htmlJogos;

            } catch (error) {
                console.error("Erro ao buscar jogos:", error);
                containerEsportes.innerHTML = `<p style="color:#ef4444; font-size:11.5px; text-align:center; margin:10px 0;">Erro ao carregar dados da API.</p>`;
            }
        }

        // Executa a função ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            carregarJogosBrasileiraoSemana();
        });
    </script>
</body>
</html>
