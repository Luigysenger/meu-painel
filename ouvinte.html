<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        hss, h2, h3 {
            color: #ff9800;
        }
        .widget {
            margin-bottom: 20px;
            padding: 15px;
            background: #2c2c2c;
            border-radius: 6px;
        }
        .alerta-tempo {
            color: #ff5722;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Interativo do Ouvinte</h2>
        
        <!-- Espaço para exibição do looping de ouvintes -->
        <div class="widget" id="painel-ouvintes-loop">
            <h3>Ouvintes Online</h3>
            <div id="info-ouvinte-atual">Carregando ouvintes...</div>
        </div>

        <!-- Alerta de 5 minutos para Ludigins -->
        <div class="widget" id="painel-alerta-ludigins">
            <h3>Status de Ludigins</h3>
            <div id="cronometro-status">Aguardando tempo...</div>
            <div id="mensagem-alerta-5min" class="alerta-tempo" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Configuração do Firebase (Substitua com suas credenciais reais se necessário)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            databaseURL: "SEU_DATABASE_URL",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializa o Firebase caso ainda não tenha sido inicializado
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app();
        }

        const db = firebase.database();

        // 1. Lógica do Looping de Ouvintes (a cada 4 segundos)
        let listaOuvintesCache = [];
        let indiceOuvinteAtual = 0;

        function iniciarLoopOuvintes() {
            const refOuvintes = db.ref('ouvintes'); // Altere o caminho conforme sua estrutura no Realtime Database
            refOuvintes.on('value', (snapshot) => {
                const dados = snapshot.val();
                listaOuvintesCache = [];
                if (dados) {
                    Object.keys(dados).forEach(key => {
                        listaOuvintesCache.push(dados[key]);
                    });
                }
            });

            // Intervalo de 4 segundos para alternar entre os ouvintes
            setInterval(() => {
                const elementoExibicao = document.getElementById('info-ouvinte-atual');
                if (!elementoExibicao) return;

                if (listaOuvintesCache.length === 0) {
                    elementoExibicao.innerHTML = "Nenhum ouvinte cadastrado no momento.";
                    return;
                }

                // Garante que o índice não estoure o tamanho da lista
                if (indiceOuvinteAtual >= listaOuvintesCache.length) {
                    indiceOuvinteAtual = 0;
                }

                const ouvinte = listaOuvintesCache[indiceOuvinteAtual];
                elementoExibicao.innerHTML = `
                    <strong>Nome:</strong> ${ouvinte.nome || 'Anônimo'}<br>
                    <strong>Ludigins:</strong> ${ouvinte.ludigins || 0}<br>
                    <strong>Categoria:</strong> ${ouvinte.categoria || 'Iniciante'}
                `;

                indiceOuvinteAtual++;
            }, 4000);
        }

        // 2. Lógica do Alerta de 5 minutos (300 segundos) para ganho de Ludigins
        function monitorarTempoLudigins() {
            // Exemplo simulado vinculado ao seu cronômetro existente. 
            // Substitua 'tempoRestanteSegundos' pela variável real do seu cronômetro do Play.
            const refTempo = db.ref('sistema/tempoRestante'); // Altere conforme sua base de dados
            
            refTempo.on('value', (snapshot) => {
                const tempoRestanteSegundos = snapshot.val() || 0; 
                const statusDiv = document.getElementById('cronometro-status');
                const alertaDiv = document.getElementById('mensagem-alerta-5min');

                statusDiv.innerHTML = `Tempo restante para os próximos Ludigins: ${Math.floor(tempoRestanteSegundos / 60)}m ${tempoRestanteSegundos % 60}s`;

                // Verifica se faltam exatamente ou aproximadamente 5 minutos (300 segundos)
                if (tempoRestanteSegundos > 0 && tempoRestanteSegundos <= 300) {
                    alertaDiv.style.display = 'block';
                    alertaDiv.innerHTML = "Ei ligadão, mais 5 minutos ouvindo e você receberá Ludigins";
                } else {
                    alertaDiv.style.display = 'none';
                    alertaDiv.innerHTML = "";
                }
            });
        }

        // Inicializa as funções ao carregar a página
        window.onload = function() {
            iniciarLoopOuvintes();
            monitorarTempoLudigins();
        };
    </script>
</body>
</html>
