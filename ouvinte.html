<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Rádios</title>
<style>
    body {
        background-color: #0b0710; /* Fundo escuro externo */
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .panel-container {
        width: 100%;
        max-width: 700px;
        background-color: #150e22; /* Fundo roxo escuro do painel */
        border-top: 1px solid #571b87;
        border-bottom: 1px solid #571b87;
    }

    .header-row {
        padding: 15px 20px;
        border-bottom: 1px solid #571b87;
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .list-item {
        padding: 15px 20px;
        border-bottom: 1px solid #571b87;
        font-size: 13px;
        font-weight: 700;
        background-color: #1a122a; /* Levemente mais claro para os itens */
    }

    /* Estilo mantido igual para a nova frase adicionada */
    .section-title {
        text-align: center;
        padding: 30px 20px 20px 20px;
        font-size: 13px;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #ffffff; 
    }

    .add-item {
        padding: 10px 20px 20px 20px;
        color: #d884ff; /* Cor roxa clara do botão adicionar */
        font-size: 13px;
        font-weight: 800;
        display: flex;
        align-items: center;
        text-transform: uppercase;
    }

    .icon {
        margin-right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Cores dos Ícones SVG */
    .star-icon svg { fill: #f59e0b; width: 18px; height: 18px; }
    .shop-icon svg { fill: #c084fc; width: 18px; height: 18px; }
    .plus-icon svg { fill: #d884ff; width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="panel-container">
    
    <!-- Ajuste 1: Acentos em "VOCÊ É UM OUVINTE" -->
    <div class="header-row">
        <span class="icon star-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </span>
        VOCÊ É UM OUVINTE:
    </div>

    <!-- Ajuste extra: Acento em "FUNÇÕES" -->
    <div class="header-row">
        <span class="icon shop-icon">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        </span>
        SUA LOJA VIRTUAL PARA DESBLOQUEAR MAIS FUNÇÕES NO PAINEL
    </div>

    <div class="list-item">Liberar o Chat</div>
    <div class="list-item">Painel de Personalização de Cards (Cores & Emojis)</div>
    <div class="list-item">Desbloquear Horóscopo</div>
    <div class="list-item">Painel Jogos e Esportes</div>

    <!-- Ajuste 2: Nova frase com a mesma fonte, cor, acentuação e pontuação final -->
    <div class="section-title">
        AQUI ESTÁ A LISTA DE RÁDIOS ADICIONADAS.
    </div>

    <div class="add-item">
        <span class="icon plus-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </span>
        1. ADICIONE SUAS RÁDIOS
    </div>
</div>

</body>
</html>
