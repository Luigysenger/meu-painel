<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL OUVINTE - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :root { 
            --primary: #A020F0; 
            --pink-light: #FFB6C1; 
            --bg: #000; 
            --card: #121212; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #121212; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            margin-bottom: 25px; 
            width: 100%; 
            max-width: 1200px; 
        }

        .header h2 { 
            margin: 0; 
            color: var(--primary); 
            font-size: 18px; 
            text-transform: uppercase; 
        }

        .btn-sair { 
            background: none; 
            border: 1px solid #442222; 
            color: #ff4444; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
        }

        .main-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 140px; 
        }

        .card-box { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid #282828; 
            width: 100%; 
        }

        h3 { 
            color: var(--primary); 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 20px; 
            text-align: center; 
            line-height: 1.4;
        }

        /* --- GRADE DE CARDS QUADRADOS --- */
        .radio-grid-ouvinte {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .radio-card-quadrado {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px;
            cursor: grab;
            color: #000;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s, border 0.3s;
            position: relative;
            border: 2px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .radio-card-quadrado:active {
            cursor: grabbing;
        }

        /* ESTILO QUANDO A RÁDIO ESTÁ SELECIONADA/TOCANDO */
        .radio-card-quadrado.playing {
            background: #151515 !important;
            color: #fff !important;
            border-color: #00ff66 !important;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .radio-card-quadrado i.icon-radio {
            font-size: 30px;
            margin-bottom: 8px;
        }

        /* ÍCONE DE ANTENA VERDE PISCANDO */
        .antena-piscando {
            color: #00ff66;
            font-size: 26px !important;
            animation: piscar 1s infinite alternate;
        }

        @keyframes piscar {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .radio-card-quadrado .radio-name {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.2;
            word-break: break-word;
        }

        /* --- MENSAGENS DO OUVINTE --- */
        .input-msg { 
            width: 100%; 
            background: #0a0a0a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            padding: 12px; 
            margin-bottom: 10px; 
            outline: none; 
            resize: none;
        }

        .btn-enviar { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
        }

        .msg-item {
            background: #181818;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
            position: relative;
        }

        .btn-delete-msg {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            transition: 0.2s;
        }

        .btn-delete-msg:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .resp-adm-box {
            background: #25122e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 3px solid var(--pink-light);
        }

        /* --- PLAYER FOOTER FLUTUANTE COM CONTROLES --- */
        .player-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #111; 
            padding: 12px 20px; 
            border-top: 2px solid var(--primary); 
            z-index: 100; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 8px;
        }

        .player-info {
            text-align: center;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn-control-step {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-control-step:hover {
            background: #333;
            border-color: var(--primary);
        }

        .btn-play {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(160, 32, 240, 0.5);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>PAINEL DO OUVINTE</h2>
            <span id="nome-ouvinte-display" style="font-size: 12px; color: #aaa;"></span>
        </div>
        <button class="btn-sair" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SAIR</button>
    </div>

    <div class="main-container">

        <!-- CARDS QUADRADOS DAS RÁDIOS -->
        <div class="card-box">
            <h3>SELECIONE UMA RÁDIO PARA OUVIR (ARRASTE PARA ORDENAR)</h3>
            <div id="grid-radios" class="radio-grid-ouvinte"></div>
        </div>

        <!-- ENVIAR MENSAGENS E VER RESPOSTAS -->
        <div class="card-box">
            <h3>MANDE MENSAGEM PARA O ADM PARA PEDIR PARA ADICIONAR UMA RADIO QUE VC GOSTE</h3>
            <textarea id="texto-mensagem" class="input-msg" rows="3" placeholder="Escreva sua mensagem aqui..."></textarea>
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar Mensagem</button>

            <h3 style="margin-top: 25px;">SUAS MENSAGENS E RESPOSTAS</h3>
            <div id="lista-respostas-adm"></div>
        </div>

    </div>

    <!-- PLAYER FOOTER CENTRALIZADO COM AVANÇAR E VOLTAR -->
    <div class="player-footer">
        <div class="player-info">
            <div id="player-title" style="font-size: 13px; font-weight: bold; color: #fff;">Nenhuma rádio selecionada</div>
        </div>
        
        <div class="player-controls">
            <!-- BOTÃO ANTERIOR -->
            <button class="btn-control-step" title="Rádio Anterior" onclick="mudarRadio(-1)">
                <i class="fas fa-step-backward"></i>
            </button>
            
            <!-- BOTÃO PLAY / PAUSE -->
            <button id="btn-play" class="btn-play" onclick="togglePlay()">
                <i class="fas fa-play"></i>
            </button>
            
            <!-- BOTÃO PRÓXIMO -->
            <button class="btn-control-step" title="Próxima Rádio" onclick="mudarRadio(1)">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
    </div>

    <audio id="audio-ouvinte"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-ouvinte');

        const ouvinteId = localStorage.getItem('userId') || ('ouvinte_' + Date.now());
        const ouvinteNome = localStorage.getItem('usuarioNome') || 'Ouvinte Anônimo';

        document.getElementById('nome-ouvinte-display').innerText = "Olá, " + ouvinteNome;

        let radiosArray = [];
        let radioTocandoIndex = -1;

        // CARREGAR RÁDIOS E RENDERIZAR
        db.ref('radios').on('value', snap => {
            let tempArray = [];
            snap.forEach(child => {
                tempArray.push({ key: child.key, ...child.val() });
            });

            // Ordenação padrão por posição
            tempArray.sort((a, b) => (a.posicao || 0) - (b.posicao || 0));

            // RESTAURAR A ORDEM SALVA LOCALMENTE PELO OUVINTE (SE EXISTIR)
            const ordemSalva = JSON.parse(localStorage.getItem('ordem_radios_ouvinte') || '[]');
            if (ordemSalva.length > 0) {
                tempArray.sort((a, b) => {
                    let indexA = ordemSalva.indexOf(a.key);
                    let indexB = ordemSalva.indexOf(b.key);
                    if (indexA === -1) indexA = 999;
                    if (indexB === -1) indexB = 999;
                    return indexA - indexB;
                });
            }

            radiosArray = tempArray;
            renderizarRadios();
        });

        function renderizarRadios() {
            const container = document.getElementById('grid-radios');
            container.innerHTML = "";

            radiosArray.forEach((r, index) => {
                const isPlaying = (radioTocandoIndex === index);
                const cardColor = r.color || '#d1a3ff';

                container.innerHTML += `
                    <div class="radio-card-quadrado ${isPlaying ? 'playing' : ''}" 
                         style="background: ${cardColor};" 
                         data-key="${r.key}"
                         onclick="tocarRadioPorIndex(${index})">
                        <i class="fas ${isPlaying ? 'fa-tower-broadcast antena-piscando' : 'fa-radio'} icon-radio"></i>
                        <span class="radio-name">${r.name}</span>
                    </div>
                `;
            });
        }

        // HABILITAR ORDENAÇÃO POR ARRASTE (SORTABLE)
        new Sortable(document.getElementById('grid-radios'), {
            animation: 150,
            delay: 100,
            delayOnTouchOnly: true,
            onEnd: function() {
                const novaOrdemKeys = [];
                document.querySelectorAll('#grid-radios .radio-card-quadrado').forEach(el => {
                    novaOrdemKeys.push(el.getAttribute('data-key'));
                });

                // Atualiza array em memória mantendo tocando a certa
                let radioAtualKey = (radioTocandoIndex >= 0 && radiosArray[radioTocandoIndex]) ? radiosArray[radioTocandoIndex].key : null;
                
                radiosArray.sort((a, b) => novaOrdemKeys.indexOf(a.key) - novaOrdemKeys.indexOf(b.key));
                
                if (radioAtualKey) {
                    radioTocandoIndex = radiosArray.findIndex(r => r.key === radioAtualKey);
                }

                // Salva a preferência de ordem no navegador do ouvinte
                localStorage.setItem('ordem_radios_ouvinte', JSON.stringify(novaOrdemKeys));
            }
        });

        // TOCAR RÁDIO POR ÍNDICE
        function tocarRadioPorIndex(index) {
            if (index < 0 || index >= radiosArray.length) return;

            const radio = radiosArray[index];

            if (radioTocandoIndex === index) {
                togglePlay();
            } else {
                radioTocandoIndex = index;
                player.src = radio.url;
                player.play().catch(() => {});
                document.getElementById('player-title').innerText = radio.name;
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
                renderizarRadios();
            }
        }

        // BOTÕES PRÓXIMO E ANTERIOR
        function mudarRadio(direcao) {
            if (radiosArray.length === 0) return;
            
            let novoIndex = radioTocandoIndex + direcao;
            if (novoIndex >= radiosArray.length) novoIndex = 0;
            if (novoIndex < 0) novoIndex = radiosArray.length - 1;

            tocarRadioPorIndex(novoIndex);
        }

        function togglePlay() {
            if (!player.src) return;
            if (player.paused) {
                player.play();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                player.pause();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // ENVIAR MENSAGEM
        function enviarMensagem() {
            const texto = document.getElementById('texto-mensagem').value.trim();
            if (!texto) return alert("Digite sua mensagem!");

            db.ref('mensagens_ouvintes').push({
                ouvinteId: ouvinteId,
                ouvinte: ouvinteNome,
                mensagem: texto,
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert("Mensagem enviada com sucesso!");
                document.getElementById('texto-mensagem').value = "";
            });
        }

        // DELETAR MENSAGEM DO OUVINTE
        function deletarMensagem(msgKey) {
            if (confirm("Deseja apagar esta mensagem?")) {
                db.ref('mensagens_ouvintes/' + msgKey).remove();
            }
        }

        // CARREGAR MENSAGENS E RESPOSTAS COM ÍCONE DE DELETAR
        db.ref('respostas_adm').on('value', snapResps => {
            const respostas = snapResps.val() || {};

            db.ref('mensagens_ouvintes').on('value', snapMsgs => {
                const container = document.getElementById('lista-respostas-adm');
                container.innerHTML = "";
                const msgs = snapMsgs.val() || {};

                let temItem = false;

                for (let id in msgs) {
                    const m = msgs[id];
                    if (m.ouvinteId === ouvinteId || m.ouvinte === ouvinteNome) {
                        temItem = true;
                        let htmlMsg = `
                            <div class="msg-item">
                                <button class="btn-delete-msg" title="Apagar Mensagem" onclick="deletarMensagem('${id}')">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                                <div style="font-size:10px; color:#aaa; margin-bottom: 3px;">Você enviou (${m.dataHora || ''}):</div>
                                <div style="font-size:13px; padding-right: 25px;">${m.mensagem}</div>
                        `;

                        // Procura respostas do ADM associadas
                        for (let rId in respostas) {
                            const r = respostas[rId];
                            if (r.ouvinteId === ouvinteId || r.ouvinte === ouvinteNome) {
                                htmlMsg += `
                                    <div class="resp-adm-box">
                                        <div style="font-size:10px; color: var(--pink-light); font-weight:bold;">Resposta do ADM (${r.dataHora || ''}):</div>
                                        <div style="font-size:13px; margin-top:2px;">${r.resposta}</div>
                                    </div>
                                `;
                            }
                        }

                        htmlMsg += `</div>`;
                        container.innerHTML += htmlMsg;
                    }
                }

                if (!temItem) {
                    container.innerHTML = "<p style='color:#666; text-align:center; font-size:12px;'>Você ainda não enviou mensagens.</p>";
                }
            });
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
