<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL OUVINTE - LUIGY</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    
    <!-- Scripts Firebase & Sortable -->
    <script src="[gstatic.com](https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js)"></script>
    <script src="[gstatic.com](https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js)"></script>
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js)"></script>
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100%;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        :root { 
            --primary: #9333ea; 
            --primary-hover: #a855f7;
            --primary-glow: rgba(147, 51, 234, 0.35);
            --pink-accent: #ff007f;
            --bg: #0b0b0e; 
            --card: #141419; 
            --card-border: #23232b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 10% 10%, rgba(147, 51, 234, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 0, 127, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            width: 100%;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            gap: 16px;
            background: rgba(20, 20, 25, 0.7); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 24px; 
            border-radius: 20px; 
            border: 1px solid var(--card-border); 
            margin-bottom: 16px; 
            width: 100%; 
            max-width: 1400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header h2 { 
            margin: 0; 
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 20px; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .user-name-title {
            font-size: 13px !important;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 2px;
            display: block;
        }

        .header-widgets {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ccc;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .widget-item {
            background: #1a1a22;
            padding: 7px 14px;
            border-radius: 12px;
            border: 1px solid #2d2d38;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .relogio-box {
            font-size: 14px !important;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .clima-box {
            font-size: 13px !important;
            font-weight: 600;
            color: #fff;
        }

        .btn-sair { 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            color: #ef4444; 
            padding: 8px 14px !important; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 12px !important; 
            font-weight: 700; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sair:hover {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .frase-centro-playlist {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #d8b4fe;
            letter-spacing: 1.5px;
            margin: 0 0 20px 0;
            width: 100%;
            max-width: 1400px;
            background: linear-gradient(90deg, rgba(147, 51, 234, 0), rgba(147, 51, 234, 0.15), rgba(147, 51, 234, 0));
            padding: 10px;
            border-radius: 12px;
            border-top: 1px solid rgba(147, 51, 234, 0.2);
            border-bottom: 1px solid rgba(147, 51, 234, 0.2);
        }

        /* LAYOUT PRINCIPAL AJUSTADO */
        .main-container { 
            display: grid; 
            grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.35fr) minmax(320px, 1.05fr);
            gap: 20px; 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto 200px auto; 
            align-items: start;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 1401px) {
            .main-container,
            .header,
            .frase-centro-playlist {
                max-width: 1380px;
            }
        }

        .card-box { 
            background: var(--card); 
            border-radius: 22px; 
            padding: 20px; 
            border: 1px solid var(--card-border); 
            width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        h3 { 
            color: var(--text-main); 
            font-size: 14px; 
            font-weight: 800;
            letter-spacing: 0.5px; 
            margin-top: 0;
            margin-bottom: 16px; 
            text-align: center; 
            line-height: 1.4;
        }

        .sub-titulo-secao {
            font-size: 12px !important;
            font-weight: 700;
            text-align: left;
            color: #c084fc !important;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .banner-destaque-adm {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15), rgba(255, 0, 127, 0.15));
            color: #f3e8ff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 14px;
            padding: 10px;
            font-size: 11.5px;
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.15);
        }

        .radios-section-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* CATÁLOGO */
        .catalogo-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .bar-radio-catalogo {
            background: #1a1a22;
            border: 1px solid #2a2a36;
            border-radius: 10px;
            padding: 11px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 600;
            font-size: 12.5px;
        }

        .bar-radio-catalogo:hover {
            border-color: var(--primary);
            transform: translateX(3px);
            background: #22222d;
        }

        .bar-radio-catalogo.adicionada {
            background: rgba(168, 85, 247, 0.15) !important;
            color: #e9d5ff !important;
            border-color: rgba(168, 85, 247, 0.4) !important;
        }

        .bar-radio-catalogo .btn-add-icon {
            font-size: 12px;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: #272734;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .bar-radio-catalogo.adicionada .btn-add-icon {
            background: var(--primary);
            color: #fff;
        }

        /* PLAYLIST */
        .playlist-grid-ouvinte {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .radio-card-quadrado {
            aspect-ratio: 1 / 1;
            min-height: 120px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            cursor: grab;
            color: #fff;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 6px 16px rgba(0,0,0,0.45);
            overflow: hidden;
        }

        .radio-card-quadrado::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%);
            z-index: 1;
        }

        .radio-card-quadrado > * {
            position: relative;
            z-index: 2;
        }

        .radio-card-quadrado:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 22px rgba(0,0,0,0.65);
        }

        .radio-card-quadrado:active {
            cursor: grabbing;
        }

        .radio-card-quadrado.playing {
            border: 2px solid #22c55e !important;
            box-shadow: 0 0 22px rgba(34, 197, 94, 0.55) !important;
        }

        .radio-card-quadrado i.icon-radio {
            font-size: 26px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
        }

        .antena-piscando {
            color: #22c55e;
            font-size: 26px !important;
            animation: piscar 1.2s infinite ease-in-out;
        }

        @keyframes piscar {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .radio-card-quadrado .radio-name {
            font-size: 11px;
            font-weight: 800;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 1px 3px rgba(0,0,0,0.85);
        }

        /* HORÓSCOPO DO DIA */
        .signos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .signo-btn {
            background: #181822;
            border: 1px solid #2b2b3b;
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #cbd5e1;
        }

        .signo-btn:hover, .signo-btn.ativo {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.35), rgba(255, 0, 127, 0.35));
            border-color: #a855f7;
            color: #fff;
            transform: translateY(-2px);
        }

        .signo-btn.ativo {
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
        }

        .signo-btn i {
            font-size: 15px;
            margin-bottom: 3px;
            color: #c084fc;
        }

        .signo-btn span {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .horoscopo-display {
            background: #0d0d12;
            border: 1px solid #2b2b3b;
            border-radius: 12px;
            padding: 10px;
            font-size: 12.5px;
            line-height: 1.4;
            color: #f1f5f9;
            min-height: 70px;
            max-height: 110px;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .horoscopo-display span.signo-titulo {
            font-weight: 800;
            color: #d8b4fe;
            display: block;
            margin-bottom: 2px;
            font-size: 13.5px;
            letter-spacing: 0.5px;
        }

        /* CHAT E MENSAGENS */
        .input-msg { 
            width: 100%; 
            background: #0f0f14; 
            border: 1px solid #272734; 
            border-radius: 12px; 
            color: #fff; 
            padding: 9px 12px; 
            margin-bottom: 8px; 
            outline: none; 
            resize: none;
            font-size: 12.5px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .input-msg:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-enviar { 
            background: linear-gradient(135deg, var(--primary), #7e22ce); 
            color: #fff; 
            border: none; 
            padding: 10px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 12.5px;
            width: 100%; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-enviar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: linear-gradient(135deg, var(--primary-hover), #9333ea);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-lista {
            background: #0d0d12;
            border: 1px solid #2b2b3b;
            border-radius: 14px;
            padding: 10px;
            min-height: 130px;
            max-height: 160px;
            overflow-y: auto;
        }

        .chat-bubble-ouvinte,
        .chat-bubble-adm {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 14px;
            margin-bottom: 10px;
            position: relative;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-bubble-ouvinte {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(126, 34, 206, 0.25));
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-right: auto;
        }

        .chat-bubble-adm {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), rgba(22, 163, 74, 0.18));
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-left: auto;
        }

        .chat-sender-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .chat-sender-name {
            font-size: 11px;
            font-weight: 800;
        }

        .chat-sender-name.ouvinte {
            color: #f0abfc;
        }

        .chat-sender-name.adm {
            color: #4ade80;
        }

        .chat-text {
            color: #fff;
            font-size: 12.5px;
        }

        .chat-time {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 5px;
        }

        .btn-delete-chat {
            background: transparent;
            color: #f87171;
            border: none;
            cursor: pointer;
            font-size: 11px;
            opacity: 0.75;
            transition: all 0.2s ease;
        }

        .btn-delete-chat:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        /* PLAYER FIXO */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #09090c;
            border-top: 1px solid #23232b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 999;
            box-shadow: 0 -8px 20px rgba(0,0,0,0.35);
        }

        .player-title {
            color: #f3f4f6;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .player-btn-mini,
        .btn-play {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-btn-mini {
            width: 34px;
            height: 34px;
            background: #1d1d27;
            color: #fff;
            border: 1px solid #2f2f3d;
        }

        .btn-play {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* TICKER DE NOTÍCIAS */
        .news-ticker-bar {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 38px;
            background: #050507;
            border-top: 1px solid #1f1f28;
            z-index: 998;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .news-label {
            background: #ef4444;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            white-space: nowrap;
            z-index: 2;
            flex-shrink: 0;
        }

        .news-ticker-wrap {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .news-ticker-track {
            display: flex;
            align-items: center;
            width: max-content;
            white-space: nowrap;
            animation: tickerMove 70s linear infinite;
            height: 100%;
        }

        .news-block-repeat {
            display: inline-flex;
            align-items: center;
        }

        .news-item-link {
            color: #f3f4f6;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            padding: 0 22px;
        }

        .news-item-divider {
            color: #a855f7;
            margin-right: 12px;
            font-size: 10px;
        }

        @keyframes tickerMove {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* SCROLL */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #101015;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b2a52;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b21a8;
        }

        /* RESPONSIVO */
        @media (max-width: 900px) {
            body {
                padding: 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-widgets {
                width: 100%;
                justify-content: flex-start;
            }

            .playlist-grid-ouvinte {
                grid-template-columns: repeat(2, 1fr);
            }

            .signos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 640px) {
            .playlist-grid-ouvinte {
                grid-template-columns: repeat(2, 1fr);
            }

            .radio-card-quadrado {
                min-height: 105px;
            }

            .signos-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .player-title {
                font-size: 12px;
                max-width: 45vw;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>Painel do Ouvinte</h2>
            <span id="nome-ouvinte-display" class="user-name-title">Olá, OUVINTE ANÔNIMO</span>
        </div>

        <div class="header-widgets">
            <div class="widget-item">
                <i class="far fa-clock" style="color:#a855f7;"></i>
                <span id="relogio-digital" class="relogio-box">00:00:00</span>
            </div>

            <div class="widget-item">
                <span id="icone-clima-dinamico"><i class="fas fa-sun" style="color: #eab308; font-size: 16px;"></i></span>
                <span id="clima-cidade" class="clima-box">Clima...</span>
            </div>

            <button class="btn-sair" onclick="logout()">
                <i class="fas fa-right-from-bracket"></i> SAIR
            </button>
        </div>
    </div>

    <div class="frase-centro-playlist">
        <i class="fas fa-headphones"></i> CURTA AQUI SUAS RÁDIOS PREFERIDAS
    </div>

    <div class="main-container">

        <!-- CARD 1 -->
        <div class="card-box">
            <h3>GERENCIAR SUAS RÁDIOS PREFERIDAS</h3>
            <div class="sub-titulo-secao"><i class="fas fa-circle-plus"></i> 1. ADICIONE SUAS RÁDIOS</div>
            <div id="catalogo-radios" class="catalogo-list"></div>
        </div>

        <!-- CARD 2 -->
        <div class="card-box">
            <h3>GERENCIAR SUAS RÁDIOS PREFERIDAS</h3>
            <div class="sub-titulo-secao"><i class="fas fa-sort"></i> 2. ARRASTE PARA REORDENAR</div>
            <div id="grid-playlist" class="playlist-grid-ouvinte"></div>
        </div>

        <!-- CARD 3 -->
        <div style="display:flex; flex-direction:column; gap:18px;">
            <div class="card-box">
                <h3><i class="fas fa-star-of-life" style="color:#c084fc;"></i> HORÓSCOPO DO DIA</h3>
                <div class="signos-grid">
