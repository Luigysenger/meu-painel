<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte - Sistema</title>
    <!-- Inclua aqui os seus estilos CSS e o SDK do Firebase -->
    <style>
        /* Mantendo seu padrão visual intacto */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #f40612;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Ouvinte</h1>
            <div>
                <span id="user-nome">Carregando...</span>
                <button onclick="logout()">Sair</button>
            </div>
        </header>

        <!-- Seção de Status e Ludgins -->
        <div class="card">
            <h2>Seu Perfil e Progresso</h2>
            <p><strong>Patente:</strong> <span id="user-patente">Iniciante</span></p>
            <p><strong>Ludgins:</strong> <span id="user-ludgins">0</span></p>
            <button onclick="adicionarLudgins(10)">Ganhar 10 Ludgins (Teste)</button>
        </div>

        <!-- Loja Virtual e Outros Elementos -->
        <div class="card">
            <h2>Loja Virtual</h2>
            <p>Gerencie seus itens e bloqueios aqui.</p>
        </div>
    </div>

    <!-- Scripts do Firebase e Lógica de Sincronização -->
    <script type="module">
        // Importe os módulos do Firebase necessários do seu projeto configurado
        // Exemplo: import { initializeApp } from "https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js";
        // import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js";

        // Variáveis globais simuladas para manter a estrutura funcionando caso o Firebase seja conectado em outro script
        window.ouvinteData = {
            nome: "Ouvinte",
            patente: "Iniciante",
            ludgins: 0,
            loja: {},
            radiosFavoritas: []
        };

        async function carregarDadosOuvinte() {
            // Aqui entra a busca no Firestore estruturada por categorias:
            // Ex: const docRef = doc(db, "ouvintes", usuarioId);
            console.log("Categorias do Firebase prontas para sincronização.");
        }

        window.adicionarLudgins = function(quantidade) {
            window.ouvinteData.ludgins += quantidade;
            document.getElementById('user-ludgins').innerText = window.ouvinteData.ludgins;
            
            // Salvar automaticamente no Firebase na categoria correspondente
            salvarDadosFirebase();
        }

        function salvarDadosFirebase() {
            // Lógica para atualizar o documento no Firebase mantendo as categorias intactas
            console.log("Dados salvos nas categorias do Firebase com sucesso.");
        }

        window.logout = function() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // Inicialização
        carregarDadosOuvinte();
    </script>
</body>
</html>
