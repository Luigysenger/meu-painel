<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL OUVINTE - SUPREMO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1DB954; --bg: #000; --card: #121212; --purple-light: #a855f7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; user-select: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 15px 20px; border-radius: 15px; border: 1px solid #282828; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        .header-brand { display: flex; flex-direction: column; gap: 2px; }
        .header-title { font-size: 20px; font-weight: 900; color: #1DB954; letter-spacing: 1px; margin: 0; text-transform: uppercase; }
        .header-sub { font-size: 13px; color: #e5e7eb; font-weight: 600; margin: 0; }
        
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .info-pill { background: #1e1e1e; border: 1px solid #333; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .info-pill i { color: #1DB954; }
        
        .btn-msg-notif { background: #1DB954; color: black; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .btn-header { background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-header:hover { background: #2a2a2a; }
        .btn-sair { color: #ff4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        @media (max-width: 850px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-brand { align-items: center; }
            .header-right { justify-content: center; }
        }

        #container-mensagens-ouvinte { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-in-out; }
        #container-mensagens-ouvinte.aberto { max-height: 2000px; margin-bottom: 25px; }
        
        /* CHAT ESTILO PAINEL ADM */
        .chat-card { background: #141414; border: 1px solid #282828; border-radius: 12px; padding: 15px; }
        .chat-history { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; padding-right: 5px; margin-bottom: 12px; }
        
        .chat-bubble { max-width: 80%; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .chat-bubble.ouvinte { align-self: flex-end; background: #1e3a29; color: #e2f8eb; border-right: 3px solid var(--primary); }
        .chat-bubble.adm { align-self: flex-start; background: #222; color: #fff; border-left: 3px solid var(--purple-light); }
        
        .chat-meta { font-size: 10px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
        
        /* CAMPO DE MENSAGEM IGUAL AO DO PAINEL ADM */
        .chat-input-area { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-area textarea { flex: 1; background: #111; border: 1px solid #333; border-radius: 6px; color: #fff; padding: 8px; font-size: 12px; resize: none; outline: none; font-family: inherit; }
        .btn-send-chat { background: var(--primary); color: #000; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-send-chat:hover { opacity: 0.9; }

        .main-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #282828; margin-bottom: 20px; }
        h3 { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }

        .radio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        @media (max-width: 480px) { .radio-grid { grid-template-columns: repeat(2, 1fr); } }

        .radio-item { aspect-ratio: 1/1; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 12px; text-align: center; padding: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
        .radio-item.active { background: #000 !important; color: var(--primary) !important; border-color: var(--primary); box-shadow: 0 0 15px rgba(29, 185, 84, 0.3); }

        .antena { font-size: 24px; margin-bottom: 8px; display: none; color: var(--primary); }
        .active .antena { display: block !important; animation: antenaPisca 0.8s infinite alternate !important; }
        @keyframes antenaPisca { from { opacity: 1; transform: scale(1.1); } to { opacity: 0.1; transform: scale(0.9); } }

        .player-footer { margin-top: 20px; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .controls-row { display: flex; align-items: center; justify-content: center; gap: 25px; }
        .btn-nav { background: none; border: none; color: #b3b3b3; font-size: 24px; cursor: pointer; }
        .btn-spotify-play { width: 55px; height: 55px; background: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: black; cursor: pointer; }

        .pub-banner-container { text-align: center; margin-bottom: 20px; display: none; }
        .pub-banner-container img { max-width: 100%; max-height: 200px; border-radius: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <h2 class="header-title">PAINEL OUVINTE</h2>
            <p class="header-sub" id="welcome-user">Bem-vindo(a)</p>
        </div>

        <div class="header-right">
            <button class="btn-msg-notif" onclick="toggleMensagens()">
                <i class="fas fa-envelope"></i> MENSAGENS E ATENDIMENTO
            </button>

            <div class="info-pill">
                <i class="far fa-clock"></i>
                <span id="hora">00:00:00</span>
            </div>

            <button class="btn-header btn-sair" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> SAIR
            </button>
        </div>
    </div>

    <div id="container-mensagens-ouvinte">
        <div class="card">
            <h3>FALE COM A RÁDIO / ATENDIMENTO</h3>
            <div class="chat-card">
                <div class="chat-history" id="chat-history-ouvinte">
                    <!-- Histórico do Chat -->
                </div>
                <!-- CAMPO DE MENSAGEM COM ATALHO ENTER / SHIFT+ENTER -->
                <div class="chat-input-area">
                    <textarea id="msg-ouvinte-input" rows="2" placeholder="Escreva sua mensagem... (Enter envia)" onkeydown="handleOuvinteKeyDown(event)"></textarea>
                    <button class="btn-send-chat" onclick="enviarMensagemOuvinte()">ENVIAR</button>
                </div>
            </div>
        </div>
    </div>

    <div id="pub-banner" class="pub-banner-container">
        <img id="pub-banner-img" src="" alt="Publicidade">
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>SELEÇÃO DE RÁDIOS</h3>
            <div id="radio-list" class="radio-grid"></div>
            
            <div class="player-footer">
                <div id="now-title" style="font-size:12px; font-weight:bold; color:#888; margin-bottom:15px;">SELECIONE UMA RÁDIO</div>
                <div class="controls-row">
                    <button class="btn-nav" onclick="prevRadio()"><i class="fas fa-step-backward"></i></button>
                    <button class="btn-spotify-play" onclick="togglePlay()"><i class="fas fa-play" id="play-icon"></i></button>
                    <button class="btn-nav" onclick="nextRadio()"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-player');

        // Identificação do Ouvinte
        let usuarioNome = localStorage.getItem('usuarioNome') || 'Ouvinte_Anonimo';
        document.getElementById('welcome-user').innerText = `Bem-vindo(a), ${usuarioNome}`;

        let radioData = [], activeIndex = -1;
        let sessionStartTime = Date.now();
        let radioStartTime = Date.now();

        // Relógio
        setInterval(() => {
            const hElement = document.getElementById('hora');
            if(hElement) hElement.innerText = new Date().toLocaleTimeString('pt-BR');
            enviarHeartbeat();
        }, 1000);

        function logout() {
            if(confirm("Deseja sair do painel?")) {
                db.ref('ouvintes_online/' + usuarioNome).update({ online: false, status: 'offline' });
                localStorage.removeItem('usuarioNome');
                window.location.href = 'index.html';
            }
        }

        function toggleMensagens() { 
            document.getElementById('container-mensagens-ouvinte').classList.toggle('aberto'); 
        }

        // =======================================================
        // SISTEMA DE CHAT DO OUVINTE
        // =======================================================
        let allMensagens = {};
        let allRespostas = {};

        function handleOuvinteKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                enviarMensagemOuvinte();
            }
        }

        function renderChatOuvinte() {
            const container = document.getElementById('chat-history-ouvinte');
            if(!container) return;
            container.innerHTML = "";

            let chatMsgs = [];

            // Mensagens do próprio ouvinte
            for(let key in allMensagens) {
                const m = allMensagens[key];
                if((m.ouvinte || m.nome) === usuarioNome) {
                    chatMsgs.push({
                        type: 'ouvinte',
                        nome: usuarioNome,
                        texto: m.mensagem,
                        dataHora: m.dataHora || '',
                        ts: m.timestamp || parseTimestamp(m.dataHora) || 0
                    });
                }
            }

            // Respostas do ADM para este ouvinte
            for(let key in allRespostas) {
                const r = allRespostas[key];
                if(r.ouvinte === usuarioNome) {
                    chatMsgs.push({
                        type: 'adm',
                        nome: 'ADM / Rádio',
                        texto: r.resposta,
                        dataHora: r.dataHora || '',
                        ts: r.timestamp || parseTimestamp(r.dataHora) || 0
                    });
                }
            }

            chatMsgs.sort((a,b) => a.ts - b.ts);

            if(chatMsgs.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#666; font-size:12px;">Nenhuma mensagem trocada ainda. Envie um recado abaixo!</div>`;
                return;
            }

            chatMsgs.forEach(msg => {
                const div = document.createElement('div');
                div.className = `chat-bubble ${msg.type}`;
                div.innerHTML = `
                    <div class="chat-meta">
                        <strong>${msg.nome}</strong>
                        <span>${msg.dataHora}</span>
                    </div>
                    <div>${msg.texto}</div>
                `;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        function enviarMensagemOuvinte() {
            const txtInput = document.getElementById('msg-ouvinte-input');
            if(!txtInput || !txtInput.value.trim()) return alert("Digite sua mensagem!");

            db.ref('mensagens_ouvintes').push({
                ouvinte: usuarioNome,
                nome: usuarioNome,
                mensagem: txtInput.value.trim(),
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                txtInput.value = "";
            });
        }

        function parseTimestamp(val) {
            if(!val) return 0;
            if(typeof val === 'number') return val;
            if(typeof val === 'string') {
                const parsed = Date.parse(val);
                if(!isNaN(parsed)) return parsed;
                const num = parseInt(val);
                if(!isNaN(num)) return num;
            }
            return 0;
        }

        db.ref('mensagens_ouvintes').on('value', snap => {
            allMensagens = snap.val() || {};
            renderChatOuvinte();
        });

        db.ref('respostas_adm').on('value', snap => {
            allRespostas = snap.val() || {};
            renderChatOuvinte();
        });

        // =======================================================
        // GERENCIAMENTO DE RÁDIOS E PLAYER
        // =======================================================
        db.ref('radios').on('value', snap => {
            radioData = []; 
            snap.forEach(c => { radioData.push({ ...c.val(), key: c.key }); });
            radioData.sort((a,b) => (a.posicao || 0) - (b.posicao || 0));
            renderRadioGrid();
        });

        function renderRadioGrid() {
            const list = document.getElementById('radio-list'); 
            if(!list) return;
            list.innerHTML = "";
            radioData.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = `radio-item ${activeIndex === i ? 'active' : ''}`;
                div.style.background = r.color || '#ece4db';
                div.onclick = () => playRadio(i);
                div.innerHTML = `<i class="fas fa-tower-broadcast antena"></i><span>${r.name}</span>`;
                list.appendChild(div);
            });
        }

        function playRadio(idx) {
            activeIndex = idx; 
            const r = radioData[idx]; 
            player.src = r.url; 
            player.play();
            radioStartTime = Date.now();

            document.getElementById('now-title').innerText = "TOCANDO AGORA: " + r.name;
            document.getElementById('play-icon').className = "fas fa-stop";
            renderRadioGrid();
            enviarHeartbeat();
        }

        function togglePlay() { 
            if(player.paused) { 
                if(activeIndex === -1 && radioData.length > 0) playRadio(0);
                else player.play(); 
                document.getElementById('play-icon').className = "fas fa-stop"; 
            } else { 
                player.pause(); 
                document.getElementById('play-icon').className = "fas fa-play"; 
            } 
        }

        function nextRadio() { if(radioData.length) playRadio((activeIndex + 1) % radioData.length); }
        function prevRadio() { if(radioData.length) playRadio((activeIndex - 1 + radioData.length) % radioData.length); }

        // Heartbeat para Monitor do ADM
        function enviarHeartbeat() {
            const radioNome = activeIndex >= 0 && radioData[activeIndex] ? radioData[activeIndex].name : 'Nenhuma';
            const agora = Date.now();

            const payload = {
                nome: usuarioNome,
                online: true,
                status: 'online',
                radioAtual: radioNome,
                lastActive: firebase.database.ServerValue.TIMESTAMP,
                timestamp: agora,
                sessionStart: sessionStartTime,
                radioStart: radioStartTime
            };

            db.ref('ouvintes_online/' + usuarioNome).update(payload);
            db.ref('ouvintes_preferencias/' + usuarioNome).update(payload);
        }

        // Publicidade direcionada
        db.ref('publicidade').on('value', snap => {
            const pubs = snap.val() || {};
            const agora = Date.now();
            let pubExibir = null;

            for(let key in pubs) {
                const p = pubs[key];
                if(p.inicio <= agora && p.fim >= agora) {
                    if(p.destino === 'TODOS' || (p.destino === 'MANUAL' && p.ouvinteAlvo === usuarioNome)) {
                        pubExibir = p;
                        break;
                    }
                }
            }

            const container = document.getElementById('pub-banner');
            const img = document.getElementById('pub-banner-img');
            if(pubExibir && pubExibir.imagem) {
                img.src = pubExibir.imagem;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        });
    </script>
</body>
</html>
