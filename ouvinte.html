<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL OUVINTE - LUIGY</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        html {
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 20px;
            width: 100vw !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :root { 
            --primary: #A020F0; 
            --pink-light: #FFB6C1; 
            --bg: #000; 
            --card: #121212; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #121212; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            margin-bottom: 25px; 
            width: 100%; 
            max-width: 1200px; 
        }

        .header h2 { 
            margin: 0; 
            color: var(--primary); 
            font-size: 18px; 
            text-transform: uppercase; 
        }

        .btn-sair { 
            background: none; 
            border: 1px solid #442222; 
            color: #ff4444; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
        }

        .main-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 120px; 
        }

        .card-box { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid #282828; 
            width: 100%; 
        }

        h3 { 
            color: var(--primary); 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
            text-align: center; 
        }

        /* --- GRADE DE CARDS QUADRADOS LADO A LADO --- */
        .radio-grid-ouvinte {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .radio-card-quadrado {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            border: 3px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .radio-card-quadrado:hover {
            transform: translateY(-3px);
        }

        .radio-card-quadrado.playing {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.03);
        }

        .radio-card-quadrado i.icon-radio {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .radio-card-quadrado .radio-name {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.2;
            word-break: break-word;
        }

        /* --- SEÇÃO DE MENSAGENS DO OUVINTE --- */
        .input-msg { 
            width: 100%; 
            background: #0a0a0a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            padding: 12px; 
            margin-bottom: 10px; 
            outline: none; 
            resize: none;
        }

        .btn-enviar { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
        }

        .msg-item {
            background: #181818;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid var(--primary);
        }

        .resp-adm-box {
            background: #25122e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 3px solid var(--pink-light);
        }

        /* --- PLAYER FOOTER FLUTUANTE --- */
        .player-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #111; 
            padding: 15px 25px; 
            border-top: 2px solid var(--primary); 
            z-index: 100; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }

        .btn-play {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>PAINEL DO OUVINTE</h2>
            <span id="nome-ouvinte-display" style="font-size: 12px; color: #aaa;"></span>
        </div>
        <button class="btn-sair" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SAIR</button>
    </div>

    <div class="main-container">

        <!-- CARDS QUADRADOS DAS RÁDIOS -->
        <div class="card-box">
            <h3>SELECIONE UMA RÁDIO PARA OUVIR</h3>
            <div id="grid-radios" class="radio-grid-ouvinte"></div>
        </div>

        <!-- ENVIAR MENSAGENS E VER RESPOSTAS -->
        <div class="card-box">
            <h3>MANDAR RECADO / PEDIDO DE MÚSICA</h3>
            <textarea id="texto-mensagem" class="input-msg" rows="3" placeholder="Escreva sua mensagem ou pedido de música aqui..."></textarea>
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar Mensagem</button>

            <h3 style="margin-top: 25px;">SUAS MENSAGENS E RESPOSTAS</h3>
            <div id="lista-respostas-adm"></div>
        </div>

    </div>

    <!-- PLAYER FOOTER -->
    <div class="player-footer">
        <div>
            <div id="player-title" style="font-size: 13px; font-weight: bold; color: #fff;">Nenhuma rádio selecionada</div>
            <div style="font-size: 10px; color: #888;">Clique em uma rádio acima para tocar</div>
        </div>
        <button id="btn-play" class="btn-play" onclick="togglePlay()"><i class="fas fa-play"></i></button>
    </div>

    <audio id="audio-ouvinte"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGGdz8gJSrXWqq3hSQIoe3pop5MGYt20Q",
            authDomain: "meu-painel-f2efe.firebaseapp.com",
            databaseURL: "https://meu-painel-f2efe-default-rtdb.firebaseio.com/",
            projectId: "meu-painel-f2efe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audio-ouvinte');

        const ouvinteId = localStorage.getItem('userId') || ('ouvinte_' + Date.now());
        const ouvinteNome = localStorage.getItem('usuarioNome') || 'Ouvinte Anônimo';

        document.getElementById('nome-ouvinte-display').innerText = "Olá, " + ouvinteNome;

        let radiosArray = [];
        let radioTocandoKey = null;

        // CARREGAR RÁDIOS E RENDERIZAR QUADRADAS LADO A LADO
        db.ref('radios').on('value', snap => {
            radiosArray = [];
            snap.forEach(child => {
                radiosArray.push({ key: child.key, ...child.val() });
            });

            // Ordenação idêntica ao painel ADM
            radiosArray.sort((a, b) => (a.posicao || 0) - (b.posicao || 0));

            const container = document.getElementById('grid-radios');
            container.innerHTML = "";

            radiosArray.forEach(r => {
                const isPlaying = radioTocandoKey === r.key;
                const cardColor = r.color || '#d1a3ff';

                container.innerHTML += `
                    <div class="radio-card-quadrado ${isPlaying ? 'playing' : ''}" 
                         style="background: ${cardColor};" 
                         onclick="tocarRadio('${r.key}')">
                        <i class="fas ${isPlaying ? 'fa-volume-high' : 'fa-radio'} icon-radio"></i>
                        <span class="radio-name">${r.name}</span>
                    </div>
                `;
            });
        });

        // TOCAR RÁDIO
        function tocarRadio(key) {
            const radio = radiosArray.find(r => r.key === key);
            if(!radio) return;

            if(radioTocandoKey === key) {
                togglePlay();
            } else {
                radioTocandoKey = key;
                player.src = radio.url;
                player.play();
                document.getElementById('player-title').innerText = radio.name;
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
                
                // Re-renderiza estilo ativo
                db.ref('radios').once('value');
            }
        }

        function togglePlay() {
            if(!player.src) return;
            if(player.paused) {
                player.play();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                player.pause();
                document.getElementById('btn-play').innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // ENVIAR MENSAGEM AO ADM
        function enviarMensagem() {
            const texto = document.getElementById('texto-mensagem').value.trim();
            if(!texto) return alert("Digite sua mensagem!");

            db.ref('mensagens_ouvintes').push({
                ouvinteId: ouvinteId,
                ouvinte: ouvinteNome,
                mensagem: texto,
                dataHora: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert("Mensagem enviada para o Locutor/ADM!");
                document.getElementById('texto-mensagem').value = "";
            });
        }

        // CARREGAR MENSAGENS ENVIADAS E RESPOSTAS DO ADM
        db.ref('respostas_adm').on('value', snapResps => {
            const respostas = snapResps.val() || {};

            db.ref('mensagens_ouvintes').on('value', snapMsgs => {
                const container = document.getElementById('lista-respostas-adm');
                container.innerHTML = "";
                const msgs = snapMsgs.val() || {};

                let temItem = false;

                for(let id in msgs) {
                    const m = msgs[id];
                    if(m.ouvinteId === ouvinteId || m.ouvinte === ouvinteNome) {
                        temItem = true;
                        let htmlMsg = `
                            <div class="msg-item">
                                <div style="font-size:10px; color:#aaa; margin-bottom: 3px;">Você enviou (${m.dataHora || ''}):</div>
                                <div style="font-size:13px;">${m.mensagem}</div>
                        `;

                        // Procura se o ADM respondeu esta mensagem especificamente
                        for(let rId in respostas) {
                            const r = respostas[rId];
                            if(r.ouvinteId === ouvinteId || r.ouvinte === ouvinteNome) {
                                htmlMsg += `
                                    <div class="resp-adm-box">
                                        <div style="font-size:10px; color: var(--pink-light); font-weight:bold;">Resposta do ADM (${r.dataHora || ''}):</div>
                                        <div style="font-size:13px; margin-top:2px;">${r.resposta}</div>
                                    </div>
                                `;
                            }
                        }

                        htmlMsg += `</div>`;
                        container.innerHTML += htmlMsg;
                    }
                }

                if(!temItem) {
                    container.innerHTML = "<p style='color:#666; text-align:center; font-size:12px;'>Você ainda não enviou mensagens.</p>";
                }
            });
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
